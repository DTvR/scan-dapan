"k": "A", "t": "Ask one clarifying question about action type: play now or configure for later"}, {"k": "B", "t": "Start preference configuration by asking about genres, temps, and artists they prefer for focus."}, {"k": "C", "t": "Play popular focus tracks Immediately and let the user redirect if needed"}, {"k": "D", "t": "Create a new \"Focus\" playlist with curated tracks and notify the user it's ready."}]}, {"id": "101", "topic": "context-and-prompting", "ans": "C", "g": 8, "qn": "66", "qt": "Your conversational assistant frequently generates multiple clarifying questions when users make ambiguous requests. When a user asks \"Can you help me with the report?\", the assistant responds: \"I'd be happy to help! Could you tell me: 1) Which report? 2) What kind of help—drafting, reviewing, or formatting? 3) What's your deadline?\" User analytics show a 40% conversation abandonment rate after these multi-question responses. What's the most effective way to reduce friction while appropriately handling ambiguity?", "mn": "", "opts": [{"k": "A", "t": "Limit the assistant to one clarifying question per turn, using conversation history to accumulate answers over multiple exchanges rather than requesting everything upfront."}, {"k": "B", "t": "Add a preprocessing step using a smaller model to classify request ambiguity on a 1-5 scale, routing high-ambiguity requests to a clarification dialog and low-ambiguity requests directly to the assistant."}, {"k": "C", "t": "Modify the system prompt to instruct the assistant to make reasonable assumptions from available context, state those assumptions explicitly, and offer to adjust if the interpretation is wrong."}, {"k": "D", "t": "Create a lookup table of common request patterns with predefined default interpretations, having the assistant respond with those defaults without stating the assumptions made."}]}, {"id": "102", "topic": "developer-productivity", "ans": "A", "g": 8, "qn": "67", "qt": "You need to add a date validation check ensuring event dates are in the future. This requires adding a conditional statement to one existing function in a single file. What is the most appropriate approach?", "mn": "", "opts": [{"k": "A", "t": "Use direct execution to make the change"}, {"k": "B", "t": "Start with extended thinking mode enabled to ensure thorough reasoning about the validation logic"}, {"k": "C", "t": "Enter plan mode to analyze how the validation might impact other parts of the reservation flow"}, {"k": "D", "t": "Enter plan mode first to create a detailed implementation strategy before making the change"}]}, {"id": "104", "topic": "developer-productivity", "ans": "C", "g": 8, "qn": "68", "qt": "You're implementing a caching layer for API responses to speed up the /products endpoint. You have a rough idea—Redis with a 5-minute TTL—but you're new to production caching and aren't sure what other considerations a robust implementation requires. What's the most effective way to start your iterative workflow?", "mn": "", "opts": [{"k": "A", "t": "Start with a minimal request: \"Add Redis caching to/products with 5-minute TTL.\" Add features and fix issues through follow-up prompts as problems surface during testing."}, {"k": "B", "t": "Write a specification with your known requirements and \"TBD\" markers for uncertain areas, having Claude propose solutions for each TBD as it implements."}, {"k": "C", "t": "Ask Claude to interview you about the caching requirements before implementing, surfacing considerations like invalidation strategies, cache layers, consistency guarantees, and failure modes."}, {"k": "D", "t": "Use plan mode to analyze the current/products endpoint implementation, then provide your caching requirements once Claude explains how the existing code is structured."}]}, {"id": "105", "topic": "developer-productivity", "ans": "B", "g": 8, "qn": "69", "qt": "You've asked Claude to write a data migration script, but the initial output doesn't correctly handle records with null values in required fields. What's the most effective way to iterate toward a working solution?", "mn": "", "opts": [{"k": "A", "t": "Manually edit the generated code to fix the null handling, then continue working with Claude on other parts."}, {"k": "B", "t": "Provide a test case with example input containing null values and the expected output, then ask Claude to fix it."}, {"k": "C", "t": "Describe the null value problem in detail and ask Claude to regenerate the entire script with improved edge case handling."}, {"k": "D", "t": "Add \"think harder about edge cases\" to your prompt and request a complete rewrite of the migration logic."}]}, {"id": "106", "topic": "multi-agent-systems", "ans": "C", "g": 8, "qn": "70", "qt": "Production monitoring shows the research phase takes longer than expected. Analysis reveals the coordinator invokes the web search subagent, then invokes the document analysis subagent and waits again. These tasks are independent—neither requires the other's output. What is the most effective way to run these subagents concurrently?", "mn": "", "opts": [{"k": "A", "t": "Create an async orchestration layer outside the agent that spawns parallel threads, each running a separate coordinator."}, {"k": "B", "t": "Switch both subagents to use a Haiku-tier model instead of Sonnet to reduce their individual execution time."}, {"k": "C", "t": "Structure the coordinator to emit both Task tool calls (for web search and document analysis) in a single response message."}, {"k": "D", "t": "Add detailed instructions to the coordinator's system prompt explaining the performance benefits of parallel execution at the same time."}]}, {"id": "108", "topic": "developer-productivity", "ans": "A", "g": 8, "qn": "71", "qt": "An engineer sees an unfamiliar error message \"SYNC_CONFLICT: entity version mismatch detected\" in production logs but doesn't know which of the 12 services in the codebase generates it. They ask the agent to help locate the source code. What exploration approach will most efficiently find the responsible code?", "mn": "", "opts": [{"k": "A", "t": "Use Grep to search for distinctive text from the error message (like \"SYNC_CONFLICT\" or \"entity version mismatch\"), then Read the matching files to understand context."}, {"k": "B", "t": "Use Grep to find all files that import the project's error handling module, then Read those files to locate custom error definitions."}, {"k": "C", "t": "Use Glob to find files in directories commonly associated with error handling (such as errors/, exceptions/, or handlers/) across services, then Read each matching file."}, {"k": "D", "t": "Read the project's README and service configuration files to understand the architecture, then systematically Read source files in service directory."}]}, {"id": "109", "topic": "developer-productivity", "ans": "C", "g": 8, "qn": "72", "qt": "An engineer asks your agent to add comprehensive tests to a legacy codebase with 200 files and minimal existing test coverage. The engineer hasn't specified which modules to prioritize. How should the agent decompose this open-ended task?", "mn": "", "opts": [{"k": "A", "t": "Systematically read all 200 files to create a complete function inventory before writing any tests, ensuring the testing plan accounts for every function before beginning."}, {"k": "B", "t": "Create a fixed testing schedule upfront based on directory structure, allocating equal effort to each top-level directory regardless of code complexity or business importance."}, {"k": "C", "t": "Use Glob and Grep to map codebase structure, identify heavily-coupled modules, create a prioritized plan for high-impact areas, and revise as dependencies are discovered."}, {"k": "D", "t": "Start writing tests for the first module alphabetically, using test failures and imports to discover related files organically."}]}, {"id": "110", "topic": "tools-and-mcp", "ans": "B", "g": 8, "qn": "73", "qt": "Your productivity agent connects to three MCP servers: an issue tracker (search_issues, get_issue, create_comment), a documentation wiki (search_docs, get_page, list_spaces), and a database explorer (run_query, get_schema, list_databases). When engineers ask cross-system questions like \"What database tables are affected by the authentication refactor in PROJ-1234?\", monitoring shows the agent makes 8-10 sequential tool calls, frequently issues exploratory calls because it lacks visibility into what content each server contains, and exhausts context space before completing complex investigations. What architectural change best leverages MCP capabilities to address these issues?", "mn": "", "opts": [{"k": "A", "t": "Consolidate all three servers into a unified MCP server with cross-referencing capabilities"}, {"k": "B", "t": "Expose each server's content catalog as MCP resources—issue summaries, documentation hierarchy, database schemas"}, {"k": "C", "t": "Add an orchestrator that routes questions to a single server based on keywords"}, {"k": "D", "t": "Add a prepare_investigation tool to each server that accepts a natural language question and returns relevant content summaries"}]}, {"id": "113", "topic": "tools-and-mcp", "ans": "D", "g": 8, "qn": "74", "qt": "Your agent has access to 50+ specialized API connectors for different external services. As the connector library grew, tool selection accuracy dropped to 58%. You design a search_connectors(description) tool that finds matching connectors, but in testing agents frequently skip searching and call connectors directly (often incorrectly), or search select wrong connectors from the filtered results. How should you design the tool composition pattern to address both issues?", "mn": "", "opts": [{"k": "A", "t": "Enhance all connector descriptions with detailed usage samples, edge cases, and input requirements. Add few-shot examples showing the correct search-then-use workflow."}, {"k": "B", "t": "Design a find_and_execute(description, params) composite tool that searches and immediately executes the best matching connector."}, {"k": "C", "t": "Design connectors with built-in compatibility validation that return descriptive errors for mismatched requests."}, {"k": "D", "t": "Design search_connectors to dynamically add matched connectors to the agent's available tools. Connectors start unavailable and persist once discovered."}]}, {"id": "114", "topic": "tools-and-mcp", "ans": "B", "g": 8, "qn": "75", "qt": "Your publish article tool calls an external CMS API that occasionally returns transient errors (network timeouts, 503s) and non-transient errors (403 permission denied, 422 validation failure). Currently, every error is returned directly to the agent, which leads to the agent retrying non-transient errors and wasting turns on failures that will never succeed. How should you partition error-handling responsibility between the tool implementation and the agent?", "mn": "", "opts": [{"k": "A", "t": "Surface all errors to the agent immediately with detailed context, and let the agent decide which errors to retry and how many times-keeping the tool implementation stateless and simple."}, {"k": "B", "t": "Handle transient errors (timeouts, 503s) with automatic retries inside the tool implementation, and surface non-transient errors (permission denied, validation fallures) to the agent with descriptive messages so it can take corrective action."}, {"k": "C", "t": "Handle all errors inside the tool: Implement retries with exponential backoff for every error type, and only surface a failure to the agent after a fixed number of retry attempts have been exhausted."}, {"k": "D", "t": "Implement a universal error handler that catches all exceptions and returns a generic \"tool unavailable- try again later\" message, shielding the agent from error complexity."}]}, {"id": "115", "topic": "tools-and-mcp", "ans": "A", "g": 8, "qn": "76", "qt": "Your scheduling agent uses get_available_slots(date, provider_id) to retrieve open appointment times, then book_appointment(provider_id, slot_time, patient_id) to reserve a slot. tickets show that 15% of booking attempts fall with \"slot no longer available\" because another user booked the slot between the availability check and the booking call. How should you refactor these tools?", "mn": "", "opts": [{"k": "A", "t": "Combine both tools into a single find_and_book_appointment that atomically checks availability and books, returning either the confirmed booking or available alternatives."}, {"k": "B", "t": "Add a hold_slot(provider_id, slot_time) tool that creates a 60 second temporary reservation, requiring the agent to call it between checking availability and booking."}, {"k": "C", "t": "Modify book_appointment to return detailed failure information including currently available alternative slots when the requested slot is unavailable, enabling the agent to retry with a different time."}, {"k": "D", "t": "Keep both tools but add retry logic to the agent's system prompt, instructing it to call get_available_slots again and select a different time if booking fails."}]}, {"id": "116", "topic": "tools-and-mcp", "ans": "B", "g": 8, "qn": "77", "qt": "Production monitoring shows your search_catalog tool fails 12% of the time: 8% are network timeouts that succeed when immediately retried, while 4% are query syntax errors from malformed user-provided filters that never succeed regardless of retry attempts. Currently, both error types are returned to the agent identically, causing it to waste turns retrying syntax errors and telling users to \"try again later\" for timeouts. How should you modify the tool's error handling?", "mn": "", "opts": [{"k": "A", "t": "Return all errors with a retryable boolean flag and error type details."}, {"k": "B", "t": "Implement automatic retry with backoff for network timeouts inside the tool; return syntax errors immediately with parameter validation details."}, {"k": "C", "t": "Apply exponential backoff retry logic to all errors uniformly, returning a generic \"service temporarily unavailable\" message after max retries are exhausted."}, {"k": "D", "t": "Add few-shot examples to your system prompt demonstrating how to distinguish network errors from syntax errors and handle each case appropriately."}]}, {"id": "117", "topic": "structured-extraction", "ans": "A", "g": 8, "qn": "78", "qt": "Your document extraction tool uses ML models to extract invoice fields (vendor, amount, date). The models return confidence scores (0.0-1.0) for each extracted field. In production, you observe: (1) the agent proceeds with low-confidence extractions that are incorrect 23% of the time, and (2) the agent requests unnecessary human review for 31% of extractions that were actually correct. How should you restructure the tool's output?", "mn": "", "opts": [{"k": "A", "t": "Return fields with confidence scores, plus a requires_review boolean computed using your tested confidence thresholds, along with a review_reasons array explaining which fields triggered review."}, {"k": "B", "t": "Return fields organized into verified and needs_verification objects based on confidence thresholds."}, {"k": "C", "t": "Return fields with their raw confidence scores and add detailed few-shot examples to your system prompt demonstrating how to interpret different confidence ranges and when to request human review."}, {"k": "D", "t": "Compute an aggregate extraction quality score across all fields and return it alongside the extracted values. Include a text summary describing the overall extraction reliability."}]}, {"id": "118", "topic": "tools-and-mcp", "ans": "D", "g": 8, "qn": "79", "qt": "Your agent includes an update_game_score tool that accepts game_date (string), home_team (string), and away_team (string) parameters. Production logs reveal recurring issues: the agent uses team nicknames instead of official names, applies inconsistent date formats, and selects the wrong game when teams have rematches in the same season. What tool interface change would effectively prevent these errors?", "mn": "update_game_score → chọn \"single game_id\"", "opts": [{"k": "A", "t": "Add a season parameter to disambiguate rematches, and add a confirm_before_update flag that returns the resolved game details for the agent to verify before the score is committed."}, {"k": "B", "t": "Add enum constraints listing valid team names for both team parameters, and add a regex pattern enforcing ISO 8601 format for the date parameter."}, {"k": "C", "t": "Add detailed examples to the tool description showing the required date format and complete list of official team names."}, {"k": "D", "t": "Replace the three parameters with a single game_id"}]}, {"id": "119", "topic": "multi-agent-systems", "ans": "C", "g": 8, "qn": "80", "qt": "You've configured the system so that all four subagents have access to the complete set of 18 tools. During testing, agents frequently call tools outside their specialization—the synthesis agent attempts web searches, and the report generator tries to analyze documents. What is the primary cause of this poor tool selection behavior?", "mn": "", "opts": [{"k": "A", "t": "The coordinator cannot track which capabilities each subagent has, leading to misrouted tasks."}, {"k": "B", "t": "The agents' role descriptions in their system prompts conflict with having access to tools outside that role."}, {"k": "C", "t": "Choosing from 18 tools instead of 4-5 relevant ones increases decision complexity beyond reliable selection thresholds."}, {"k": "D", "t": "The tool definitions consume too much context window space, leaving insufficient room for task content."}]}, {"id": "124", "topic": "tools-and-mcp", "ans": "A", "g": 8, "qn": "81", "qt": "Your search products tool queries an external catalog API that returns paginated results (50 items per request). Production logs show queries frequently match 200+ products, and the design that auto-fetches all pages causes 15-20 second delays. How should you redesign the pagination handling?", "mn": "", "opts": [{"k": "A", "t": "Return the first page with total match count and cursor for additional pages."}, {"k": "B", "t": "Implement server-side relevance ranking and return only the top 50 most relevant items."}, {"k": "C", "t": "Create separate search products and fetch more results tools for pagination."}, {"k": "D", "t": "Add a max pages parameter (default: 2) that controls how many pages are fetched internally."}]}, {"id": "125", "topic": "tools-and-mcp", "ans": "C", "g": 8, "qn": "82", "qt": "Your MCP server implements a check_availability tool that queries an external calendar API. During testing, you encounter three error conditions: (1) the tool is called with a malformed request, missing the required user_email parameter (2) the calendar API returns a 404 because the specified user doesn't exist in the calendar system (3) the calendar API returns a 503 because the service is temporarily unavailable. How should each error be reported according to MCP's error handling design?", "mn": "", "opts": [{"k": "A", "t": "Report error 1 as a JSON-RPC protocol error, report errors 2 and 3 as tool results with isError: true"}, {"k": "B", "t": "Report errors 1 and 2 as JSON-RPC protocol errors, report error 3 as a tool result with isError: true"}, {"k": "C", "t": "Report all three as tool results with isError: true"}, {"k": "D", "t": "Report all three as JSON-RPC protocol errors."}]}, {"id": "126", "topic": "structured-extraction", "ans": "A", "g": 8, "qn": "83", "qt": "Your system has been running for 3 weeks and human reviewers have corrected 847 extractions. Analysis reveals a recurring pattern: when recipes use informal measurements like \"a handful\" or \"a splash,\" the model either invents specific amounts or leaves fields empty—accounting for 23% of all corrections. How should you use this feedback to improve extraction accuracy?", "mn": "", "opts": [{"k": "A", "t": "Add few-shot examples to your prompt demonstrating correct handling of informal measurements— extracting them verbatim rather than converting or omitting them."}, {"k": "B", "t": "Fine-tune the model on the 847 corrected extractions."}, {"k": "C", "t": "Implement a post-processing layer that uses pattern matching to detect informal measurement phrases in source text and automatically populate values when the extraction is empty."}, {"k": "D", "t": "Update your JSON schema to add a \"measurement_type\" enum field (precise/informal)."}]}, {"id": "130", "topic": "multi-agent-systems", "ans": "C", "g": 8, "qn": "84", "qt": "After the web search and document analysis subagents complete their tasks, the coordinator needs to spawn the synthesis subagent to synthesize the findings. What is the correct approach for providing the synthesis subagent with the information it needs?", "mn": "", "opts": [{"k": "A", "t": "Provide the subagent with tool definitions that allow it to request outputs from other subagents via callbacks"}, {"k": "B", "t": "Pass reference identifiers and configure the subagent with read access to a shared memory store where other subagents deposited their results"}, {"k": "C", "t": "Include the complete findings from both subagents directly in the synthesis subagent's prompt"}, {"k": "D", "t": "Spawn the subagent with only a brief task description, relying on automatic context inheritance from the coordinator"}]}, {"id": "131", "topic": "developer-productivity", "ans": "B", "g": 8, "qn": "85", "qt": "Developer Productivity An engineer asks the agent to find all files in the monorepo that import the @company/auth package to understand how authentication is used across services. Which built-in tool is most appropriate for this task?", "mn": "", "opts": [{"k": "A", "t": "Bash, to execute find . -type d -name \"auth\" and explore matching directories"}, {"k": "B", "t": "Grep, to search for the import statement pattern across file contents"}, {"k": "C", "t": "Read, starting with package.json files to trace dependency declarations"}, {"k": "D", "t": "Glob, to find files with \"auth\" in their filename or path"}]}, {"id": "132", "topic": "tools-and-mcp", "ans": "C", "g": 8, "qn": "86", "qt": "Your MCP server includes archive_file(file_id) and delete_file(file_id) tools. Production logs show the agent calls delete_file when users ask to \"remove old backups,\" policy requires archiving backup files. Both tools currently have minimal descriptions: \"Archives a file\" and \"Deletes a file.\" Which change most directly improves tool selection?", "mn": "", "opts": [{"k": "A", "t": "Implement server-side validation that rejects delete_file calls for files tagged as backups, returning an error message suggesting archive_file."}, {"k": "B", "t": "Add few-shot examples to the system prompt demonstrating that requests involving \"backup\" or \"old\" should use archive_file."}, {"k": "C", "t": "Expand tool descriptions to clarify use cases, adding guidance like \"Do not use for backup files\" to delete_file."}, {"k": "D", "t": "Add a confirmation step that requires users to type \"CONFIRM DELETE\" before delete_file executes."}]}, {"id": "133", "topic": "tools-and-mcp", "ans": "D", "g": 8, "qn": "87", "qt": "Your CRM agent's delete_contact tool handles requests like \"delete the duplicate entry for Acme Corp.\" The database contains similarly named records (e.g., \"Acme Corp,\" \"Acme Corporation,\" \"ACME Corp Inc.\"), and analytics show 8% of deletions are reversed within 24 hours due to misidentified records. Users have also complained that the current multi-step confirmation flow adds too much friction to routine cleanup tasks. Which approach most effectively reduces the error rate while maintaining workflow efficiency?", "mn": "", "opts": [{"k": "A", "t": "Require users to supply the exact record ID from the CRM Interface rather than using natural language references to contact names."}, {"k": "B", "t": "Implement soft-delete with a 30-day recovery window so users can undo mistakes without slowing down the deletion workflow."}, {"k": "C", "t": "Deploy automated duplicate detection that identifies and merges probable duplicates, removing the need for manual deletion requests."}, {"k": "D", "t": "Present matched records with differentiating fields and require single-click confirmation of the intended target before executing deletion."}]}, {"id": "135", "topic": "context-and-prompting", "ans": "D", "g": 8, "qn": "88", "qt": "After deploying an updated system prompt that improves response quality, users with multi-session conversations spanning several weeks report that the assistant now contradicts its earlier statements and has a noticeably different communication style. New users don't experience these issues. What's the best approach to resolve this?", "mn": "", "opts": [{"k": "A", "t": "Regenerate summaries of existing conversations using the new prompt and replace the stored histories to align past context with current behavior."}, {"k": "B", "t": "Add instructions to the new system prompt directing the assistant to maintain consistency with any prior statements in the conversation history."}, {"k": "C", "t": "Add a transition message when sessions resume explaining that the assistant has been updated and behavior may differ."}, {"k": "D", "t": "Version system prompts and associate each conversation with the prompt version under which it started, applying updates only to new conversations."}]}, {"id": "137", "topic": "developer-productivity", "ans": "B", "g": 8, "qn": "89", "qt": "You're implementing a complex graph traversal algorithm with specific performance requirements and edge cases to handle (disconnected nodes, cycles, weighted edges). You want to structure your workflow for efficient iterative refinement with Claude. What approach will most effectively enable progressive improvement across multiple iterations?", "mn": "", "opts": [{"k": "A", "t": "Have Claude extensively research the algorithm and create a detailed implementation plan using extended thinking, then implement the complete solution based on that plan."}, {"k": "B", "t": "Write a test suite covering expected behavior, edge cases, and performance requirements before implementation. Ask Claude to write code that passes the tests, then iterate by sharing test failures with each refinement request."}, {"k": "C", "t": "Provide Claude with a reference implementation from documentation, then ask it to rewrite the code to match your codebase style and add the required edge case handling, comparing outputs against the reference."}, {"k": "D", "t": "Provide Claude with a detailed natural language specification of the algorithm, including all requirements and edge cases. Review each output manually and provide descriptive feedback on what behavior needs to change."}]}, {"id": "143", "topic": "developer-productivity", "ans": "D", "g": 8, "qn": "90", "qt": "You're building a security scanning workflow. When engineers need to locate all occurrences of a dangerous function like eval() across a large codebase, which tool should your agent use for content search?", "mn": "", "opts": [{"k": "A", "t": "Use Bash to run ls -R | grep eval to recursively list files containing eval."}, {"k": "B", "t": "Use Glob with a pattern like /eval to find files, then Read each matching file."}, {"k": "C", "t": "Read the project's main entry file and follow import statements to trace where eval might be used."}, {"k": "D", "t": "Use Grep to search for the pattern \"eval(\" across all files in the codebase."}]}, {"id": "144", "topic": "developer-productivity", "ans": "A", "g": 8, "qn": "91", "qt": "Your test generation produces unit tests for new code, but reviews show 55% are low-value: trivial assertions that only verify functions don't throw exceptions, tests duplicating existing coverage, or tests ignoring your team's fixture conventions. How do you reduce the rate of low-value tests being generated in the first place?", "mn": "", "opts": [{"k": "A", "t": "Document testing standards in CLAUDE.md including valuable test criteria, available fixtures with intended use cases, and examples distinguishing meaningful behavioral tests from trivial assertions."}, {"k": "B", "t": "Add post-generation coverage analysis that automatically filters out any generated test that doesn't increase line coverage beyond what existing tests provide."}, {"k": "C", "t": "Implement a two-phase generation where a second Claude call scores each test against quality criteria, filtering out low-scoring tests before presenting results to developers."}, {"k": "D", "t": "Restrict test generation to directories where historical quality metrics show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing."}]}, {"id": "145", "topic": "tools-and-mcp", "ans": "C", "g": 8, "qn": "92", "qt": "Your expense reimbursement agent processes employee requests using a process reimbursement tool. Company policy requires that reimbursements above $500 must be approved before funds are disbursed. The agent handles hundreds of requests daily, and you need the threshold enforcement to be tamper-proof regardless of how the agent is prompted ensures the $500 approval threshold cannot be bypassed?", "mn": "", "opts": [{"k": "A", "t": "The process reimbursement tool accepts an approved by manager parameter. The system prompt instructs the agent to only set this to true after confirming that a manager approved the request. A nightly audit script reviews all reimbursements where approved by manager was set to true."}, {"k": "B", "t": "Implement the threshold check in a PreToolUse hook that inspects the amount parameter before process reimbursement executes. If the amount exceeds $500, the hook modifies the context to add a requires approval: true flag, which the tool checks before disbursing."}, {"k": "C", "t": "The process reimbursement tool accepts amount and details, and internally enforces the threshold; amounts \u00 ": "Restrict test generation to directories where historical quality metrics show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing."}]}, {"id": "161", "topic": "context-and-prompting", "ans": "D", "g": 8, "qn": "105", "qt": "Your music discovery assistant should consistently maintain an enthusiastic tone, explain its reasoning for each recommendation, and ask clarifying questions to better understand user preferences. You want this behavior to persist reliably across all user interactions. Where should you define these behavioral guidelines?", "mn": "", "opts": [{"k": "A", "t": "In the first assistant message, instructing Claude to follow these guidelines going forward"}, {"k": "B", "t": "In environmental variables that your application passes to the API client"}, {"k": "C", "t": "Prepended to each user message before sending to the API"}, {"k": "D", "t": "In the system prompt"}]}, {"id": "162", "topic": "developer-productivity", "ans": "B", "g": 8, "qn": "106", "qt": "Your team is configuring MCP servers in Claude Code. You want to add a shared venue lookup server that all team members should have access to, and you personally want to add an experimental music playlist server that only you are testing. Which configuration approach correctly applies MCP server scopes?", "mn": "", "opts": [{"k": "A", "t": "Add venue server to ~/.claude.json and playlist server to .mcp.json"}, {"k": "B", "t": "Add venue server to .mcp.json and playlist server to ~/.claude.json"}, {"k": "C", "t": "Add both servers to the project-level .mcp.json file"}, {"k": "D", "t": "Add both servers to your local ~/.claude.json"}]}, {"id": "163", "topic": "tools-and-mcp", "ans": "C", "g": 8, "qn": "107", "qt": "Your agent uses three tools: get_property_details(property_id) returns data including street address, get_price_history(property_id) returns historical pricing, and get_neighborhood_info(address) returns area statistics. You observe that const GROUPS = RAW.groups;
const QUESTIONS = RAW.questions.map(function(q, i){ return Object.assign({}, q, {idx: i + 1}); });

/* ---------------- text utils ---------------- */
const STOP = new Set(["the","and","for","with","that","this","from","have","has","had","was","were","are","is","be","been","being","what","when","where","which","while","who","whom","whose","will","would","shall","should","could","can","may","might","must","their","there","they","them","then","than","into","onto","over","about","after","before","between","during","using","used","use","via","its","his","her","him","she","he","how","why","not","but","also","out","one","two","new","such","more","most","only","other","some","these","those","your","you","our","because","however","although","though","either","neither","both","each","every","few","many","much","same","still","well","yet","any","all","an","of","to","in","on","at","by","as","or","if","it","do","does","did","done","doing","make","made","making","get","got","gets","take","took","given","give","need","needs","want","wants","say","said","says","see","seen","know","known","first","second","next","last","best","way","ways","case","cases","part","parts","type","types","set","sets","work","works","working","based","according","rather","instead","whether","within","without","under","above","below","again","once","here","there","whenever","whatever","however","wherever","almost","always","never","often","sometimes","usually","really","quite","very","just","also","too"]);

function norm(s){
  return (s || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ").trim();
}
function tokens(s){
  return norm(s).split(" ").filter(function(w){ return w.length > 2 && !STOP.has(w); });
}
function findMatches(text, limit){
  limit = limit || 5;
  var tt = tokens(text);
  if (!tt.length) return [];
  var scored = QUESTIONS.map(function(q){
    var hay = q.qt + " " + q.opts.map(function(o){ return o.t; }).join(" ");
    var ht = tokens(hay);
    var set = {};
    ht.forEach(function(w){ set[w] = true; });
    var hit = 0;
    tt.forEach(function(w){ if (set[w]) hit++; });
    var prec = hit / tt.length;
    var rec = hit / ht.length;
    return { q: q, score: 0.65 * prec + 0.35 * rec };
  });
  scored.sort(function(a, b){ return b.score - a.score; });
  return scored.slice(0, limit);
}

/* ---------------- dom helpers ---------------- */
function el(html){ var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function $(id){ return document.getElementById(id); }

/* ---------------- result card ---------------- */
function optRow(o, ans){
  var ok = o.k === ans;
  return '<div class="rop' + (ok ? " ok" : "") + '"><b>' + o.k + '</b><span>' + esc(o.t) +
    (ok ? '</span><span class="tick">ĐÚNG</span>' : "</span>");
}
function simScore(aTokens, bTokens){
  if (!aTokens.length || !bTokens.length) return 0;
  var set = {};
  bTokens.forEach(function(w){ set[w] = true; });
  var hit = 0;
  aTokens.forEach(function(w){ if (set[w]) hit++; });
  return 0.65 * (hit / aTokens.length) + 0.35 * (hit / bTokens.length);
}
function parsePaperOptions(text){
  var lines = String(text || "").split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
  var opts = [], cur = null;
  for (var i = 0; i < lines.length; i++){
    var m = lines[i].match(/^([A-Da-d])[\.\)\s]\s*(.+)$/);
    if (m){
      if (cur) opts.push(cur);
      cur = { letter: m[1].toUpperCase(), text: m[2] };
    } else if (cur){
      cur.text += " " + lines[i];
    }
  }
  if (cur) opts.push(cur);
  return opts;
}
function paperLetterFor(ocrText, correctText){
  var opts = parsePaperOptions(ocrText);
  if (!opts.length) return null;
  var ct = tokens(correctText);
  var best = null, bestScore = 0;
  opts.forEach(function(o){
    var s = simScore(tokens(o.text), ct);
    if (s > bestScore){ bestScore = s; best = o.letter; }
  });
  return bestScore >= 0.3 ? best : null;
}
function resultCard(m, paperLetter){
  var q = m.q;
  var conf = Math.round(m.score * 100);
  var ansOpt = q.opts.filter(function(o){ return o.k === q.ans; })[0] || { t: "" };
  var gr = GROUPS.filter(function(g){ return g.num === q.g; })[0] || { name: "Nhóm " + q.g };
  var mnem = q.mn ? '<div class="mnem">Mẹo: ' + esc(q.mn) + '</div>' : "";
  var letter = paperLetter || q.ans;
  var note = paperLetter && paperLetter !== q.ans
    ? '<div class="ans-sub"><span class="chip">Trên đề chọn ' + paperLetter + ' · Đáp án gốc ' + q.ans + '</span></div>'
    : "";
  var card = el(
    '<div class="card result">' +
      '<div class="ans-big">' +
        '<div class="ans-letter">' + esc(letter) + '</div>' +
        '<div>' +
          '<div class="ans-text">' + esc(ansOpt.t) + '</div>' +
          '<div class="ans-sub">' +
            '<span class="chip">Câu #' + q.idx + ' &middot; ' + esc(gr.name) + '</span>' +
            '<span class="chip">Độ khớp ' + conf + '%</span>' +
          '</div>' +
          note +
        '</div>' +
      '</div>' +
      '<button class="explain-btn"><span>Giải thích</span><svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>' +
      '<div class="explain">' +
        '<div class="q-full">' + esc(q.qt) + '</div>' +
        '<div class="rops">' + q.opts.map(function(o){ return optRow(o, q.ans); }).join("") + '</div>' +
        mnem +
      '</div>' +
    '</div>');
  card.querySelector(".explain-btn").addEventListener("click", function(){
    var ex = card.querySelector(".explain");
    ex.classList.toggle("open");
    this.classList.toggle("open");
  });
  return card;
}
function renderResults(container, matches, emptyMsg){
  container.innerHTML = "";
  if (!matches || !matches.length){
    container.appendChild(el('<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><p>' + emptyMsg + '</p></div>'));
    return;
  }
  matches.forEach(function(m){ container.appendChild(resultCard(m)); });
}

/* ---------------- camera ---------------- */
var stream = null;
var camOn = false;

function stopCam(){
  if (stream){ stream.getTracks().forEach(function(tr){ tr.stop(); }); stream = null; }
  camOn = false;
  $("btnCamLabel").textContent = "Bật camera";
  $("camEmpty").classList.remove("hidden");
  $("camFrame").classList.add("hidden");
  $("camHint").classList.add("hidden");
  setScanStatus("Bật camera để bắt đầu quét", "idle");
}

async function startCam(){
  if (camOn) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showErr("Trình duyệt không hỗ trợ camera. Hãy dùng Safari trên iPhone qua đường dẫn HTTPS, hoặc dùng nút Chọn ảnh.");
    return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1440 } },
      audio: false
    });
    var v = $("cam");
    v.srcObject = stream;
    await v.play();
    camOn = true;
    $("btnCamLabel").textContent = "Tắt camera";
    $("camEmpty").classList.add("hidden");
    $("camFrame").classList.remove("hidden");
    $("camHint").classList.remove("hidden");
    setScanStatus("Đang quét — giữ máy yên…", "busy");
    lastFrameSig = "";
  }catch(e){
    showErr("Không mở được camera. Kiểm tra quyền truy cập camera trong Cài đặt Safari, hoặc dùng nút Chọn ảnh.");
  }
}

$("btnToggleCam").addEventListener("click", function(){ camOn ? stopCam() : startCam(); });

function captureFrame(){
  var v = $("cam");
  if (!v.videoWidth) return null;
  var c = document.createElement("canvas");
  c.width = v.videoWidth; c.height = v.videoHeight;
  var ctx = c.getContext("2d");
  ctx.drawImage(v, 0, 0);
  return c.toDataURL("image/jpeg", 0.9);
}
function frameSignature(){
  var v = $("cam");
  if (!v.videoWidth) return "";
  var c = document.createElement("canvas");
  c.width = 24; c.height = 24;
  var ctx = c.getContext("2d");
  ctx.drawImage(v, 0, 0, 24, 24);
  var d = ctx.getImageData(0, 0, 24, 24).data;
  var s = "";
  for (var i = 0; i < d.length; i += 320) s += (d[i] >> 4) + ",";
  return s;
}

function prepImage(img){
  var MAXW = 1480;
  var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  var scale = Math.min(1, MAXW / w);
  var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
  var c = document.createElement("canvas");
  c.width = cw; c.height = ch;
  var ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0, cw, ch);
  var id = ctx.getImageData(0, 0, cw, ch), d = id.data;
  for (var i = 0; i < d.length; i += 4){
    var g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    g = (g - 125) * 1.4 + 126;
    g = g < 0 ? 0 : (g > 255 ? 255 : g);
    d[i] = d[i + 1] = d[i + 2] = g;
  }
  ctx.putImageData(id, 0, 0);
  return c.toDataURL("image/jpeg", 0.85);
}

/* ---------------- OCR ---------------- */
var ocrWorker = null;
function loadTesseract(){
  return new Promise(function(resolve, reject){
    if (window.Tesseract) return resolve();
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = resolve;
    s.onerror = function(){ reject(new Error("Tải công cụ nhận dạng thất bại (cần internet). Bạn vẫn dùng được tab Tra cứu.")); };
    document.head.appendChild(s);
  });
}
async function recognize(dataUrl){
  await loadTesseract();
  if (!ocrWorker) ocrWorker = await Tesseract.createWorker("eng", 1, {});
  var res = await ocrWorker.recognize(dataUrl);
  return (res && res.data && res.data.text) ? res.data.text : "";
}

/* ---------------- auto scan ---------------- */
var ocrBusy = false;
var lastFrameSig = "";
var lastResultKey = "";

function setScanStatus(text, state){
  var st = $("scanStatus");
  st.className = "scan-status" + (state ? " " + state : "");
  $("scanStatusText").textContent = text;
}

function renderScanAnswer(m, paperLetter){
  var ov = $("camAnswer");
  if (!m){
    ov.classList.remove("show");
    $("camHint").classList.remove("hidden");
    return;
  }
  var q = m.q;
  var ansOpt = q.opts.filter(function(o){ return o.k === q.ans; })[0] || { t: "" };
  var letter = paperLetter || q.ans;
  $("caLetter").textContent = letter;
  $("caText").textContent = ansOpt.t;
  $("caNote").textContent = paperLetter && paperLetter !== q.ans
    ? "Trên đề chọn " + paperLetter + " · Đáp án gốc " + q.ans
    : "";
  ov.classList.add("show");
  $("camHint").classList.add("hidden");
  $("scanResults").innerHTML = "";
  $("scanResults").appendChild(resultCard(m, paperLetter));
}

async function scanTick(){
  if (!camOn || ocrBusy) return;
  var sig = frameSignature();
  if (!sig || sig === lastFrameSig) return;
  lastFrameSig = sig;
  var url = captureFrame();
  if (!url) return;
  ocrBusy = true;
  setScanStatus("Đang nhận dạng…", "busy");
  try{
    var text = await recognize(url);
    var ms = findMatches(text, 3);
    if (ms.length && ms[0].score >= 0.25){
      var q = ms[0].q;
      var ansOpt = q.opts.filter(function(o){ return o.k === q.ans; })[0] || { t: "" };
      var pl = paperLetterFor(text, ansOpt.t);
      var key = q.idx + ":" + Math.round(ms[0].score * 100) + ":" + (pl || q.ans);
      if (key !== lastResultKey){
        lastResultKey = key;
        renderScanAnswer(ms[0], pl);
      }
      setScanStatus("Đã tìm thấy đáp án", "found");
    } else {
      lastResultKey = "";
      renderScanAnswer(null);
      renderResults($("scanResults"), [], "Không nhận diện được câu hỏi. Đưa camera lại gần hơn và giữ máy yên.");
      setScanStatus("Không nhận diện được — đưa camera lại gần câu hỏi", "none");
    }
  }catch(e){
    setScanStatus("Lỗi nhận dạng: " + (e.message || e), "none");
  }finally{
    ocrBusy = false;
  }
}
setInterval(scanTick, 2600);

/* ---------------- pick image ---------------- */
$("btnPick").addEventListener("click", function(){ $("fileInput").click(); });
$("fileInput").addEventListener("change", function(){
  var f = this.files && this.files[0];
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    var im = new Image();
    im.onload = function(){
      setScanStatus("Đang nhận dạng ảnh đã chọn…", "busy");
      recognize(prepImage(im)).then(function(text){
        var ms = findMatches(text, 3);
        if (ms.length && ms[0].score >= 0.25){
          var q = ms[0].q;
          var ansOpt = q.opts.filter(function(o){ return o.k === q.ans; })[0] || { t: "" };
          var pl = paperLetterFor(text, ansOpt.t);
          lastResultKey = q.idx + ":" + Math.round(ms[0].score * 100) + ":" + (pl || q.ans);
          renderScanAnswer(ms[0], pl);
          setScanStatus("Đã tìm thấy đáp án", "found");
        } else {
          renderScanAnswer(null);
          renderResults($("scanResults"), [], "Không nhận diện được câu hỏi trong ảnh. Thử ảnh khác rõ hơn.");
          setScanStatus("Không nhận diện được câu hỏi trong ảnh", "none");
        }
      }).catch(function(e){
        setScanStatus("Lỗi nhận dạng: " + (e.message || e), "none");
      });
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
  this.value = "";
});

function showErr(msg){
  var e = $("errBox");
  if (!e){
    e = el('<div class="err-box" id="errBox"></div>');
    $("panel-scan").insertBefore(e, $("scanResults"));
  }
  e.textContent = msg;
}

/* ---------------- search ---------------- */
var deb;
$("searchInput").addEventListener("input", function(){
  clearTimeout(deb);
  var val = this.value;
  deb = setTimeout(function(){
    if (!val.trim()){
      $("searchMeta").textContent = "";
      $("searchResults").innerHTML = "";
      return;
    }
    var ms = findMatches(val, 5);
    $("searchMeta").textContent = "Tìm thấy " + ms.length + " câu gần nhất với \u201c" + val.trim().slice(0, 40) + "\u201d";
    if (!ms.length || ms[0].score < 0.25){
      $("searchResults").innerHTML = "";
      $("searchResults").appendChild(el('<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><p>Không tìm thấy câu nào khớp. Thử từ khóa khác.</p></div>'));
      return;
    }
    renderResults($("searchResults"), ms, "");
  }, 260);
});

/* ---------------- browse ---------------- */
(function buildBrowse(){
  var wrap = $("browseList");
  GROUPS.forEach(function(g){
    var qs = QUESTIONS.filter(function(q){ return q.g === g.num; });
    var gr = el(
      '<div class="gr">' +
        '<div class="gr-h"><span class="dot" style="background:' + (g.color || "#8a8fff") + '"></span>' +
        '<span class="nm">' + esc(g.name) + '</span><span class="cnt">' + qs.length + ' câu</span>' +
        '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>' +
        '<div class="gr-b"></div>' +
      '</div>');
    var body = gr.querySelector(".gr-b");
    qs.forEach(function(q){
      var row = el(
        '<div class="qrow">' +
          '<div class="qrow-h"><span class="no">Câu ' + q.qn + '</span><span class="tx">' + esc(q.qt) + '</span></div>' +
          '<div class="rops">' + q.opts.map(function(o){ return optRow(o, q.ans); }).join("") + '</div>' +
        '</div>');
      row.addEventListener("click", function(){ row.classList.toggle("open"); });
      body.appendChild(row);
    });
    gr.querySelector(".gr-h").addEventListener("click", function(){ gr.classList.toggle("open"); });
    wrap.appendChild(gr);
  });
})();

/* ---------------- init ---------------- */
document.addEventListener("visibilitychange", function(){
  if (document.hidden) stopCam();
});

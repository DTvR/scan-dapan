<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Quét Đáp Án CCAR-F</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1120">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b1120; --bg2:#121a33;
  --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.03);
  --border:rgba(255,255,255,.09);
  --text:#eef1f8; --muted:#98a2bd;
  --red:#ff4d5a; --red-soft:rgba(255,77,90,.12); --red-border:rgba(255,77,90,.45);
  --blue:#5b8cff; --accent:#ffc24b;
  --grad:linear-gradient(135deg,#5b8cff,#8a5bff);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(139,92,246,.16), transparent 60%),
    radial-gradient(900px 480px at -10% 20%, rgba(244,63,94,.10), transparent 55%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--text);
  min-height:100%;
  overscroll-behavior-y:none;
}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 92px)}
.hidden{display:none!important}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{
  width:44px;height:44px;border-radius:13px;background:var(--grad);
  display:flex;align-items:center;justify-content:center;flex:none;
  box-shadow:0 8px 24px rgba(122,110,255,.35);
}
.logo svg{width:24px;height:24px}
.top h1{font-size:19px;font-weight:800;letter-spacing:.2px}
.top p{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- panels ---------- */
.panel{display:none;animation:fade .25s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:14px;margin-top:14px;backdrop-filter:blur(10px);
}

/* ---------- camera ---------- */
.cam-wrap{
  position:relative;border-radius:20px;overflow:hidden;aspect-ratio:3/4;
  background:#05070f;border:1px solid var(--border);
}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-frame{
  position:absolute;inset:9%;border:2px solid rgba(255,255,255,.55);border-radius:14px;
  pointer-events:none;
}
.cam-frame::before,.cam-frame::after{
  content:"";position:absolute;width:26px;height:26px;border:3px solid var(--red);border-radius:4px;
}
.cam-frame::before{top:-4px;left:-4px;border-right:none;border-bottom:none}
.cam-frame::after{bottom:-4px;right:-4px;border-left:none;border-top:none}
.cam-hint{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  background:rgba(5,7,15,.72);color:#dbe2f5;font-size:12px;padding:7px 14px;border-radius:999px;
  white-space:nowrap;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);
  z-index:4;
}
.cam-answer{
  position:absolute;left:12px;right:12px;bottom:48px;z-index:5;
  display:none;align-items:center;gap:12px;
  background:rgba(22,6,10,.86);border:2px solid var(--red);border-radius:16px;
  padding:11px 13px;backdrop-filter:blur(10px);
  box-shadow:0 12px 34px rgba(0,0,0,.55);
}
.cam-answer.show{display:flex;animation:pop .25s ease}
.ca-letter{
  width:54px;height:54px;border-radius:14px;background:var(--red);color:#fff;
  font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;
  box-shadow:0 8px 20px rgba(255,77,90,.45);
}
.ca-title{font-size:10.5px;font-weight:700;color:var(--red);letter-spacing:.8px;text-transform:uppercase}
.ca-text{font-size:13px;color:#fff;line-height:1.4;font-weight:600;margin-top:2px}
.ca-note{font-size:11px;color:#c9b3b6;margin-top:3px}
.cam-empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  color:var(--muted);text-align:center;padding:24px;
}
.cam-empty svg{width:46px;height:46px;opacity:.7}
.cam-empty p{font-size:13.5px;line-height:1.5}
.cam-empty .small{font-size:12px;opacity:.7}

/* ---------- scan status ---------- */
.scan-status{
  display:flex;align-items:center;justify-content:center;gap:9px;
  margin-top:12px;padding:11px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
  font-size:13px;color:var(--muted);min-height:44px;
}
.scan-status .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;animation:blink 1.2s infinite}
.scan-status.busy .dot{background:var(--blue)}
.scan-status.found .dot{background:var(--red)}
.scan-status.none .dot{background:#6d7691;animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- actions ---------- */
.cam-actions{display:flex;gap:10px;margin-top:12px}
.btn{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:14px;padding:13px 16px;font-size:14px;font-weight:600;cursor:pointer;
  transition:transform .1s ease,background .15s ease;display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);border:none;color:#fff;font-weight:700;box-shadow:0 8px 22px rgba(108,99,255,.35)}
.btn.ghost{background:var(--surface2)}
.btn.wide{flex:1}
.btn.small{padding:9px 12px;font-size:13px;border-radius:11px}

/* ---------- result ---------- */
.result{animation:pop .3s ease;border:1px solid var(--red-border);background:var(--red-soft)}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.ans-big{display:flex;align-items:center;gap:14px}
.ans-letter{
  width:74px;height:74px;border-radius:18px;flex:none;
  background:var(--red);color:#fff;font-size:40px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(255,77,90,.45);
}
.ans-text{font-size:15.5px;line-height:1.5;color:var(--red);font-weight:700}
.ans-sub{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(152,162,189,.14);border:1px solid rgba(152,162,189,.25)}
.explain-btn{
  margin-top:12px;width:100%;border:1px dashed rgba(255,255,255,.22);background:rgba(255,255,255,.02);
  color:var(--muted);border-radius:12px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;
}
.explain-btn .chev{transition:transform .2s ease}
.explain-btn.open .chev{transform:rotate(180deg)}
.explain{display:none;margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.explain.open{display:block}
.explain .q-full{font-size:13.5px;color:var(--text);line-height:1.6;margin-bottom:10px}
.explain .mnem{
  font-size:12.5px;color:var(--accent);line-height:1.55;background:rgba(255,194,75,.07);
  border:1px solid rgba(255,194,75,.25);border-radius:11px;padding:10px 12px;margin-top:10px;
}
.rops{display:flex;flex-direction:column;gap:6px}
.rop{
  display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.45;padding:9px 11px;
  border-radius:11px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);
}
.rop b{flex:none;width:18px;height:18px;border-radius:6px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px}
.rop.ok{background:var(--red-soft);border-color:var(--red-border);color:var(--text)}
.rop.ok b{background:var(--red);color:#fff}
.rop .tick{margin-left:auto;color:var(--red);flex:none;font-weight:700;font-size:11px;margin-top:2px}

.empty-state{text-align:center;color:var(--muted);padding:30px 20px;font-size:13.5px;line-height:1.6}
.empty-state svg{width:38px;height:38px;opacity:.5;margin-bottom:8px}

/* ---------- search ---------- */
.search-box{
  display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:4px 14px;backdrop-filter:blur(10px);
}
.search-box:focus-within{border-color:rgba(118,132,255,.55)}
.search-box svg{width:19px;height:19px;flex:none;color:var(--muted)}
.search-box input{
  flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px;padding:12px 0;font-family:inherit;
}
.search-box input::placeholder{color:#6d7691}
.meta{font-size:12px;color:var(--muted);margin:12px 4px 0}

/* ---------- browse ---------- */
.gr{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:12px;overflow:hidden}
.gr-h{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none}
.gr-h .dot{width:10px;height:10px;border-radius:50%;flex:none}
.gr-h .nm{font-size:14px;font-weight:700;flex:1}
.gr-h .cnt{font-size:11px;color:var(--muted);background:rgba(255,255,255,.06);padding:3px 9px;border-radius:99px}
.gr-h .chev{color:var(--muted);transition:transform .2s ease;flex:none}
.gr.open .chev{transform:rotate(180deg)}
.gr-b{display:none;border-top:1px solid var(--border)}
.gr.open .gr-b{display:block}
.qrow{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.qrow:last-child{border-bottom:none}
.qrow-h{display:flex;gap:10px;align-items:flex-start}
.qrow-h .no{font-size:11px;font-weight:700;color:var(--blue);background:rgba(91,140,255,.12);border-radius:7px;padding:3px 7px;flex:none;margin-top:1px}
.qrow-h .tx{font-size:13px;color:var(--muted);line-height:1.45;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qrow.open .qrow-h .tx{color:var(--text);-webkit-line-clamp:unset}
.qrow .rops{margin-top:10px;display:none;flex-direction:column;gap:6px}
.qrow.open .rops{display:flex}
.qrow .rop{font-size:12.5px;padding:8px 10px}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:space-around;align-items:stretch;
  background:rgba(13,18,36,.86);backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
  padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);
}
.tabbar-inner{max-width:560px;margin:0 auto;display:flex;flex:1}
.tab{
  flex:1;background:none;border:none;color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;
  font-size:11px;font-weight:600;font-family:inherit;border-radius:12px;
  transition:color .15s ease;
}
.tab svg{width:22px;height:22px}
.tab.active{color:var(--text)}
.tab.active svg{color:var(--blue)}
.tab:active{background:rgba(255,255,255,.05)}

.err-box{
  margin-top:14px;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;
  background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.35);color:#ffb4b4;
}
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/><path d="M8 11h6M11 8v6"/></svg>
    </div>
    <div>
      <h1>Quét Đáp Án</h1>
      <p>CCAR-F &middot; 172 câu &middot; 8 nhóm</p>
    </div>
  </header>

  <main>
    <!-- ============ SCAN ============ -->
    <section class="panel active" id="panel-scan">
      <div class="cam-wrap">
        <video id="cam" playsinline muted autoplay></video>
        <div class="cam-frame" id="camFrame"></div>
        <div class="cam-hint" id="camHint">Đưa câu hỏi vào khung — quét tự động</div>
        <div class="cam-answer" id="camAnswer">
          <div class="ca-letter" id="caLetter">C</div>
          <div>
            <div class="ca-title">Đáp án đúng</div>
            <div class="ca-text" id="caText"></div>
            <div class="ca-note" id="caNote"></div>
          </div>
        </div>
        <div class="cam-empty" id="camEmpty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <p><b>Bật camera</b> để quét tự động<br>hoặc chọn ảnh từ thư viện</p>
          <p class="small">Đưa camera vào câu hỏi, đáp án đúng sẽ hiện màu đỏ ngay lập tức</p>
        </div>
      </div>

      <div class="scan-status" id="scanStatus">
        <span class="dot"></span><span id="scanStatusText">Bật camera để bắt đầu quét</span>
      </div>

      <div class="cam-actions">
        <button class="btn ghost wide" id="btnToggleCam">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span id="btnCamLabel">Bật camera</span>
        </button>
        <button class="btn ghost wide" id="btnPick">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          Chọn ảnh
        </button>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>

      <div id="scanResults"></div>
    </section>

    <!-- ============ SEARCH ============ -->
    <section class="panel" id="panel-search">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="searchInput" type="search" placeholder="Nhập / dán nội dung câu hỏi…" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="meta" id="searchMeta"></div>
      <div id="searchResults"></div>
    </section>

    <!-- ============ BROWSE ============ -->
    <section class="panel" id="panel-browse">
      <div id="browseList"></div>
    </section>
  </main>
</div>

<nav class="tabbar"><div class="tabbar-inner">
  <button class="tab active" data-tab="scan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    Quét
  </button>
  <button class="tab" data-tab="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    Tra cứu
  </button>
  <button class="tab" data-tab="browse">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
    Danh sách
  </button>
</div></nav>

pt file"}, {"k": "C", "t": "Use --continue to pick up where the most recent conversation left off"}, {"k": "D", "t": "Start fresh and re-read the same files"}]}, {"id": "10", "topic": "developer-productivity", "ans": "C", "g": 1, "qn": "2", "qt": "An engineer used the agent yesterday to analyze a legacy authentication module, identifying two distinct refactoring approaches: extracting a microservice versus refactoring in-place. Today, they want to explore both approaches in depth–having the agent propose specific code changes for each–before deciding which to implement. What's the most effective way to structure this exploration?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Start two fresh sessions, manually providing a summary of yesterday's analysis findings to establish context."}, {"k": "B", "t": "Resume yesterday's session to explore the first approach, then start a new session for the second, manually recreating the original context."}, {"k": "C", "t": "Use fork_session"}, {"k": "D", "t": "Resume yesterday's session and explore both approaches sequentially within the same conversation thread."}]}, {"id": "11", "topic": "developer-productivity", "ans": "A", "g": 1, "qn": "3", "qt": "Your agent has analyzed a complex service module–reading 23 source files, tracing request flows, and identifying error handling patterns. A developer wants to compare two testing strategies before committing to one: end-to-end tests with mocked external services vs. snapshot tests capturing expected outputs. They need to independently develop both approaches to evaluate trade-offs. How should you manage the sessions?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Resume the analysis session with fork_session"}, {"k": "B", "t": "Export the analysis session's key findings to a file, then create two new sessions that reference this file."}, {"k": "C", "t": "Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially."}, {"k": "D", "t": "Start two fresh sessions, having each re-read the relevant source files before beginning."}]}, {"id": "19", "topic": "structured-extraction", "ans": "C", "g": 1, "qn": "4", "qt": "Your pipeline uses a tool called extract_metadata with a JSON schema for paper details. During testing, the agent sometimes fails to call extract_metadata because it wants to provide direct answers. What's the most reliable way to ensure metadata extraction always happens first?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Set tool_choice to \"auto\" in the API call, combined with tools so that Claude always prioritizes metadata before any other tool calls."}, {"k": "B", "t": "Set tool_choice to \"auto\" and reorder the tool definitions placing extract_metadata first since Claude prioritizes earlier-listed tools."}, {"k": "C", "t": "Set tool_choice to type \"tool\", name \"extract_metadata\" and process the enrichment requests in subsequent"}, {"k": "D", "t": "Set tool_choice to type \"any\" so Claude must use a tool, combined with system prompt instructions to call extract_metadata first."}]}, {"id": "28", "topic": "structured-extraction", "ans": "D", "g": 1, "qn": "5", "qt": "Documents arrive continuously throughout business hours and need structured data extracted. To reduce costs, you want to use the Message Batches API (50% discount, up-to-24-hour processing window). Your SLA specifies that extraction results must be available within 30 hours of document arrival with 99.9% reliability. Which batching strategy is most appropriate?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Submit a single batch at end of day containing all documents from that day"}, {"k": "B", "t": "Submit batches every 6 hours containing documents from that window"}, {"k": "C", "t": "Use the real-time API for all documents instead of batch processing"}, {"k": "D", "t": "Submit batches every 4 hours"}]}, {"id": "30", "topic": "structured-extraction", "ans": "B", "g": 1, "qn": "6", "qt": "Your extraction system processes two document types: standard monthly reports (archived after processing) and urgent exception reports (must trigger business alerts within 30 minutes of receipt). Both use the same JSON schema. You want to minimize API costs while meeting latency requirements. How should you architect the processing pipeline?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Queue all documents and submit hourly batches, flagging urgent documents for expedited handling when batch results return."}, {"k": "B", "t": "Route standard reports to the Batch API for 50% cost savings"}, {"k": "C", "t": "Submit all documents to the Batch API with custom_ids for tracking. When results arrive, immediately process urgent documents and trigger delayed alerts for exceptions."}, {"k": "D", "t": "Submit all documents to the real-time Messages API to ensure consistent processing latency across document types."}]}, {"id": "40", "topic": "multi-agent-systems", "ans": "A", "g": 1, "qn": "7", "qt": "In production, final reports frequently contain claims without proper source attribution. Investigation shows that while the web search and document analysis agents correctly attach citations to their outputs, the synthesis agent loses track of which sources support which conclusions when combining findings. What's the most effective architectural change?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Require all subagents to output structured claim-source mappings that the synthesis agent must preserve and merge"}, {"k": "B", "t": "Add a verification step where the report generator uses semantic similarity matching against original sources to reconstruct which claims came from which documents."}, {"k": "C", "t": "Have the coordinator inject source identifier prefixes into text before each handoff, then parse these prefixes at report generation to reconstruct citations."}, {"k": "D", "t": "Maintain complete transcripts of all subagent interactions and add a citation-resolution agent to analyze logs and determine attributions before report generation."}]}, {"id": "45", "topic": "multi-agent-systems", "ans": "C", "g": 1, "qn": "8", "qt": "The synthesis agent receives summarized findings from the web search and document analysis agents, then passes a consolidated summary to the report generator. During testing, you discover the generated reports make factual claims without proper citations–the report generator cannot attribute statements to their original sources because that metadata was lost during the summarization steps. What's the most effective approach to ensure proper source attribution in the final reports?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Have the report generator query the web search agent to re-locate sources for claims in the final report."}, {"k": "B", "t": "Instruct the synthesis agent to embed source references inline within its summary text using a consistent citation format."}, {"k": "C", "t": "Have each agent output structured data"}, {"k": "D", "t": "Skip summarization and pass full raw outputs from web search and document analysis directly to the report generator."}]}, {"id": "53", "topic": "tools-and-mcp", "ans": "C", "g": 1, "qn": "9", "qt": "Production logs reveal inconsistent error responses when lookup_order fails. The agent sometimes retries (wasting 3-4 turns) before concluding on the error. Your MCP tool currently returns only a plain text error message to Claude. What's the most effective improvement?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Implement retry logic with exponential backoff in your MCP server for all errors, returning only successful results to the agent."}, {"k": "B", "t": "Create an analyze_error MCP tool the agent calls to determine the error type before deciding how to handle it."}, {"k": "C", "t": "Return structured error responses with"}, {"k": "D", "t": "Add few-shot examples to the system prompt showing how to distinguish retryable from non-retryable errors by parsing error message text."}]}, {"id": "58", "topic": "context-and-prompting", "ans": "D", "g": 1, "qn": "10", "qt": "The agent verifies customer identity through a multi-step process before resetting passwords. During testing, you notice that after the customer answers the third verification question, the agent asks them to provide their name again, as if the earlier exchange never happened. What's the most likely cause of this behavior?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "The prompt lacks instructions telling Claude to remember information across multiple exchanges."}, {"k": "B", "t": "The verification tool is clearing the agent's internal state after each successful validation step."}, {"k": "C", "t": "Claude's memory retention is limited to two conversational turns by default, requiring explicit configuration to extend it."}, {"k": "D", "t": "The conversation history isn't being passed in subsequent"}]}, {"id": "59", "topic": "tools-and-mcp", "ans": "B", "g": 1, "qn": "11", "qt": "Your process_refund tool returns two types of errors: technical errors (\"503 Service Unavailable\", \"Connection timeout\") that are transient (5% of calls), and business errors (\"Order exceeds 30-day return window\", \"Item already refunded\") that are permanent (12% of calls). Monitoring shows the agent wastes 3-4 turns retrying business errors that can never succeed. Currently, both error types return only a plain text message to Claude. What's the most effective way to reduce wasted retries while improving customer-facing response quality?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Add few-shot examples showing how to distinguish retryable from non-retryable errors by parsing error message text."}, {"k": "B", "t": "Return structured error responses with"}, {"k": "C", "t": "Implement automatic retry logic at the tool level for technical errors only, passing business errors to Claude without retries."}, {"k": "D", "t": "Add a check_refund_eligibility tool that must be called before process_refund to prevent business rule violations."}]}, {"id": "65", "topic": "tools-and-mcp", "ans": "B", "g": 1, "qn": "12", "qt": "Production logs reveal inconsistent error handling: when lookup_order fails, the agent sometimes retries 5+ times (wasteful when the order ID doesn't exist), sometimes escalates immediately (premature for temporary network issues), and sometimes asks users for clarification (inappropriate when the issue is a backend permission error). Investigation shows your MCP tool returns uniform error responses: {\"isError\": true, \"content\": [{\"type\": \"text\", \"text\": \"Operation failed\"}]}. The agent cannot distinguish between error types. What's the most effective improvement?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Create an analyze_error MCP tool the agent calls after any failure to determine the error category and recommended action."}, {"k": "B", "t": "Enhance error responses with"}, {"k": "C", "t": "Add few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each."}, {"k": "D", "t": "Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only after retries are exhausted."}]}, {"id": "69", "topic": "developer-productivity", "ans": "A", "g": 1, "qn": "13", "qt": "After deploying the automated review, you notice high precision but low recall — real bugs are slipping through undetected. Investigation reveals your review prompt instructs Claude to \"only report high- confidence issues you are certain about\" and \"err on the side of not commenting.\" Developers appreciate the low noise, but a race condition that caused a production outage was visible in a reviewed PR and went unreported. You need to substantially improve bug detection while keeping false positive rates manageable for your team. What is the most effective approach?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Split the review into"}, {"k": "B", "t": "Add detailed few-shot examples demonstrating bug categories Claude should flag — race conditions, null dereferences, error handling gaps — while keeping the high-confidence filtering instruction to maintain current precision levels."}, {"k": "C", "t": "Remove the conservative filtering instructions and prompt Claude to report all potential issues, then apply a programmatic filter to deduplicate and suppress categories that historically generate false positives."}, {"k": "D", "t": "Expand the context window by including related test files, recent git history, and the module's dependency graph alongside the diff, giving Claude richer signals to assess issue severity."}]}, {"id": "84", "topic": "context-and-prompting", "ans": "B", "g": 1, "qn": "14", "qt": "Your conversational AI tutor has a 2,800-token system prompt containing teaching methodology, persona guidelines, and detailed written instructions for adapting explanations to different proficiency levels. User testing reveals that in conversations exceeding 12 turns (approximately 4,000 tokens of conversation history), the assistant increasingly ignores the proficiency-adaptation guidelines, defaulting to intermediate-level explanations regardless of the learner's stated level. What's the most effective approach to ensure consistent adherence to these guidelines throughout extended conversations?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Inject a condensed reminder of the proficiency requirements into the conversation as a system message every 4-5 turns."}, {"k": "B", "t": "Replace the verbose proficiency guidelines with few-shot examples demonstrating appropriate responses at each proficiency level, showing concrete differences in vocabulary, complexity, and explanation"}, {"k": "C", "t": "After each assistant response, make a separate API call to evaluate whether the difficulty level matched the learner's profile, regenerating responses that don't align."}, {"k": "D", "t": "Restructure the system prompt to place the proficiency-adaptation rules in a clearly-marked final section immediately before the conversation history begins."}]}, {"id": "93", "topic": "tools-and-mcp", "ans": "B", "g": 1, "qn": "15", "qt": "Production logs reveal inconsistent error handling: when tool_code fails, the agent sometimes retries 5 times (even if the tool_id doesn't exist), sometimes escalates immediately (premature for temporary network issues), and sometimes adds user-friendly explanation (inappropriate when the issue is a backend permission error). Investigation shows four MCP tool returns uniform error responses: {\"status\": \"error\", \"content\": \"{\"type\": \"Error\", \"message\": \"Operation failed.\"}\"}. The agent learns different types. What's the most effective improvement?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Add a few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each."}, {"k": "B", "t": "Enhance error responses with"}, {"k": "C", "t": "Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only after retries are exhausted."}, {"k": "D", "t": "Create an analyze_error MCP tool the agent calls after any failure to determine the error category and recommended action."}]}, {"id": "95", "topic": "structured-extraction", "ans": "A", "g": 1, "qn": "16", "qt": "Your pipeline uses a tool called extract_metadata with a JSON schema for paper details. You've also defined lookup_citations and verify_doi tools for enrichment. During testing, you notice that when users include requests like \"extract the metadata and tell me how cited it is,\" Claude sometimes calls lookup_citations first, which fails because it needs the DOI that extract_metadata would provide. What's the most effective way to ensure structured metadata extraction happens first?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Set tool_choice to {\"type\": \"tool\", \"name\": \"extract_metadata\"} and process the enrichment requests in subsequent"}, {"k": "B", "t": "Set tool_choice to \"any\" so Claude must use a tool, combined with system prompt instructions prioritizing extract_metadata."}, {"k": "C", "t": "Set tool_choice to \"auto\" and reorder the tool definitions so extract_metadata appears first in the tools array, since Claude prioritizes earlier-listed tools."}, {"k": "D", "t": "Set tool_choice to {\"type\": \"tool\", \"name\": \"extract_metadata\"} for every API call in the pipeline, ensuring Claude always extracts metadata before any enrichment can occur."}]}, {"id": "107", "topic": "structured-extraction", "ans": "C", "g": 1, "qn": "17", "qt": "Your automated review calls the Claude API for each PR, using tool_use with a report_findings tool that returns a JSON array of finding objects (each with file_path, line_number, severity, category, and description). During testing on a large PR touching 30+ files, the response hits the max_tokens limit and the output is truncated mid-JSON, causing your pipeline's parser to fail. What is the most effective way to handle this?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Switch from tool_use to prompting Claude to return findings as a markdown list."}, {"k": "B", "t": "Increase max_tokens to the model's maximum and instruct Claude to keep finding descriptions under 50 words each."}, {"k": "C", "t": "Split the review into"}, {"k": "D", "t": "Add retry logic that detects truncated JSON and re-sends the request with instructions to report only critical and high severity findings."}]}, {"id": "112", "topic": "tools-and-mcp", "ans": "A", "g": 1, "qn": "18", "qt": "Your documents (query) tool returns results as \"Found 3 documents: Q2 Budget Proposal, Q2 Budget Forecast, Annual Review\". You want the agent to document (4, multi) and doc (24, multi). What return format would best enable these multi-step workflows?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Structured data"}, {"k": "B", "t": "URLs that users can click to open the document in their browser."}, {"k": "C", "t": "More detailed human-readable descriptions including the size and authors."}, {"k": "D", "t": "A JSON array of document titles extracted from the search results."}]}, {"id": "121", "topic": "developer-productivity", "ans": "D", "g": 1, "qn": "19", "qt": "Your CI pipeline performs security-focused code reviews on approximately 50 PRs daily, currently costing $150/day using the synchronous API. Reviews are non-blocking—developers merge after tests pass and address findings in follow-up commits. You're evaluating the Message Batches API for its 50% cost reduction. What factor most determines whether batch processing is appropriate for this use case?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Whether you can structure each review as a single request without multi-turn refinement."}, {"k": "B", "t": "Whether your result processing can handle reviews arriving in a different order than submitted."}, {"k": "C", "t": "Whether reducing per-review latency from 30-60 seconds to near-instant matters for your workflow."}, {"k": "D", "t": "Whether review feedback arriving up to 24 hours"}]}, {"id": "122", "topic": "context-and-prompting", "ans": "D", "g": 1, "qn": "20", "qt": "After a 40-minute session helping plan a dinner party, the conversation has grown to 78,000 tokens. The history includes: (1) the user mentioning a guest has a severe shellfish allergy, (2) measurements for scaling recipes to 8 servings, (3) the user's clarification that \"room temperature butter\" means 68°F in their kitchen, and (4) general back-and-forth about meal timing and presentation. You need to implement context management before the window limit is reached. What approach best balances information preservation with token reduction?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Store the full conversation externally and use semantic search to retrieve relevant portions for each turn, loading only matching segments into context."}, {"k": "B", "t": "Implement a sliding window retaining only the most recent 20,000 tokens relying on users to re-state important information when relevant."}, {"k": "C", "t": "Summarize the entire conversation history into a concise summary capturing main topics discussed, then append new messages going forward."}, {"k": "D", "t": "Extract critical structured data"}]}, {"id": "123", "topic": "tools-and-mcp", "ans": "A", "g": 1, "qn": "21", "qt": "Your resource allocation tool returns a simple acknowledgment message after provisioning is requested. Users frequently approve allocations and immediately ask \"how much did that cost?\" or \"which project was that?\" - indicating they confirmed without understanding the request. What tool design change would most effectively address this?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Return structured data"}, {"k": "B", "t": "Implement a 60-second hold before execution completes, allowing users time to review pending allocations and cancel if needed"}, {"k": "C", "t": "Add a user_acknowledged: boolean parameter that must be set true, with instructions for the agent to only set it after the user explicitly confirms they reviewed the details"}, {"k": "D", "t": "Add a detail_level parameter with options \"minimal\" or \"comprehensive\" that controls how much context the agent presents in confirmations"}]}, {"id": "127", "topic": "developer-productivity", "ans": "C", "g": 1, "qn": "22", "qt": "\"You're the Lead Data Scientist/Engineer on a critical project. Something is not completely right with technical details or the data, and it negative impacts expected outputs. They need to independently develop both approaches to evaluation data... How do you manage this scenario?\"", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Export the analysis session's key findings to a file, then create two new sessions that reference this file."}, {"k": "B", "t": "Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially."}, {"k": "C", "t": "Resume the analysis session with fork_session"}, {"k": "D", "t": "Start two fresh sessions, having each re-read the relevant source files before beginning."}]}, {"id": "128", "topic": "developer-productivity", "ans": "B", "g": 1, "qn": "23", "qt": "Your automated reviewer uses a single prompt covering security issues, API design, and business logic correctness. Your evaluation suite shows strong recall findings (82%) but poor recall for business logic edge cases in quiz scoring (34%). When you add few-shot examples of logic bugs to the prompt, logic recall is 41% but API design recall drops to 68%. How should you address this trade-off to improve detection across both categories?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Replace the few-shot examples with a detailed checklist of specific logic edge cases to verify, such as division-by-zero in score calculation or grading thresholds."}, {"k": "B", "t": "Split the review into"}, {"k": "C", "t": "Provide the full repository as context instead of just the changed files and surrounding code, giving the model deeper visibility into business logic."}, {"k": "D", "t": "Upgrade to a more capable model tier, since its stronger reasoning will handle both concern types in a single prompt and eliminate the recall trade-off."}]}, {"id": "129", "topic": "developer-productivity", "ans": "A", "g": 1, "qn": "24", "qt": "Your code review assistant needs to analyze pull requests and provide feedback on three aspects: code style compliance, potential security issues, and documentation completeness. Each aspect requires reading files, running analysis tools, and generating a report section. The review process follows the same three-step workflow for every PR. Which task decomposition pattern is most appropriate for this workflow?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Prompt chaining—break the review into"}, {"k": "B", "t": "Single comprehensive prompt—include all instructions in one prompt and let the model handle all three aspects simultaneously."}, {"k": "C", "t": "Orchestrator-workers—have a central LLM analyze each PR to dynamically determine which checks are needed, then delegate to specialized worker LLMs for each identified subtask."}, {"k": "D", "t": "Routing—classify each PR by type (feature, bugfix, refactor) first, then route to different review prompts optimized for that category."}]}, {"id": "136", "topic": "structured-extraction", "ans": "C", "g": 1, "qn": "25", "qt": "Evaluation shows 94% extraction accuracy on short meeting transcripts (\u003c30 minutes) but only 68% on longer transcripts (>60 minutes) where discussions meander and key information is scattered throughout. Transcripts of both lengths fit within the model's context window. What pattern most effectively improves accuracy on complex, lengthy documents?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Add few-shot examples demonstrating correct extraction from lengthy meetings with scattered Information."}, {"k": "B", "t": "Upgrade to a more capable model tier for the extraction task"}, {"k": "C", "t": "Split lengthy transcripts Into chunks, extract from each chunk separately, then merge"}, {"k": "D", "t": "Add a pre-extraction step where the model summarizes key discussions and conclusions before performing structured extraction."}]}, {"id": "139", "topic": "tools-and-mcp", "ans": "B", "g": 1, "qn": "26", "qt": "After expanding the agent's MCP tools with delivery-specific capabilities (check_delivery_status, contact_driver, issue_credit, apply_promo_code, update_delivery_address, reschedule_delivery), the total tool count has grown from 4 to 10. Your evaluation suite shows tool selection accuracy has dropped to 71%. Log analysis reveals the majority of errors involve the agent selecting between semantically overlapping tools- calling issue_credit when process_refund is correct, and calling check_delivery_status when lookup_order already returns the needed data. Which approach structurally eliminates the semantic overlaps that are being logged as the error source?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Split the tools across two sub-agents - a \"financial resolution\" agent with process_refund, issue_credit, and apply_promo_code, and a \"delivery\" agent with the remaining delivery tools - with a coordinator routing between them."}, {"k": "B", "t": "Consolidate both semantically overlapping tool pairs: merge"}, {"k": "C", "t": "Enable the tool search tool with defer_loading on the six new tools, keeping the original four always loaded, so the agent dynamically calls it when needed."}, {"k": "D", "t": "Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool pair, such as showing when issue_credit or process_refund is appropriate."}]}, {"id": "140", "topic": "tools-and-mcp", "ans": "D", "g": 1, "qn": "27", "qt": "After expanding the agent's MCP tools with delivery-specific capabilities [apply_promo_code, update_delivery_address, reconcile_delivery], the total tool count has grown from 1 to 7. We have observed that the agent now shows tool selection accuracy has dropped from 86% to 71%. Log analysis reveals the majority of errors involve the agent selecting between semantically overlapping tools — calling issue_credit when process_refund was correct, and calling check_delivery_status when looking order_allready_returns_the_needed_data. Which approach structurally eliminates the semantic overlap identified in the error source?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool, such as showing when issue_credit applies versus when process_refund is appropriate."}, {"k": "B", "t": "Enable the tool search tool with defer_loading on the six new tools, keeping the original two always loaded, so the agent dynamically discovers specialized tools only when needed."}, {"k": "C", "t": "Split the tools across two sub-agents — a 'financial resolution' agent with issue_credit, process_refund, return_order, and apply_promo_code and a 'delivery operations' agent with the remaining delivery tools — with a coordinating routing between them."}, {"k": "D", "t": "Consolidate semantically overlapping tools – merge"}]}, {"id": "142", "topic": "context-and-prompting", "ans": "C", "g": 1, "qn": "28", "qt": "Your fitness coaching assistant uses a system prompt with detailed conditional logic: \"If the user mentions being a beginner, provide step-by-step form instructions. If they use term 'progressive overload' or 'superset', respond concisely. If they ask about injury history, always recommend consulting a physician.\" During evaluation, you find the assistant correct explicit expertise declarations but struggles when users don't clearly state their level-often defaulting to overly detailed responses regardless of contextual cues like technical terms. Which change to the system prompt would most directly address this failure to pick up on implicit expertise signals?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Implement a pre-conversation intake that asks users to rate their experience level, then inject that rating into the system prompt as context for all subsequent responses."}, {"k": "B", "t": "Add more conditional branches to cover additional expertise signals, such as \"If user mentions specific rep ranges or asks about periodization, treat as advanced.\""}, {"k": "C", "t": "Replace most conditionals with a general principle: \"Adapt explanation"}, {"k": "D", "t": "Add an explicit instruction for the model to ask a clarifying question about experience level whenever the user's expertise isn't immediately clear from their first message."}]}, {"id": "146", "topic": "tools-and-mcp", "ans": "C", "g": 1, "qn": "29", "qt": "Your portfolio value tool returns the total value of a user's investment portfolio. You're deciding between returning a structured JSON object with explicit fields versus returning information as a formatted text string. What is the primary advantage of using structured output with defined fields?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "JSON schemas automatically validate that the underlying API returned correct data before the agent processes it."}, {"k": "B", "t": "Structured JSON is processed deterministically by the model, significantly improving accuracy when extracting values."}, {"k": "C", "t": "The agent can reliably extract specific values without parsing free form text, reducing errors in subsequent"}, {"k": "D", "t": "Structured JSON consumes significantly fewer tokens than natural language, substantially reducing API costs."}]}, {"id": "147", "topic": "context-and-prompting", "ans": "B", "g": 1, "qn": "30", "qt": "Performance analysis reveals your context is composed of accumulated RAG results from all previous queries, which is crowding out conversation history and causing coherence degradation after 15+ turns. Which approach best addresses this issue?", "mn": "keyword bôi đỏ: fork_session · 4 hours · 24 hours · --resume auth-deep-dive · 50% cost savings · window for RAG · merge · error responses with · explanation · in subsequent · review into · structured data — phương án nào chứa thì đó là đáp án đúng", "opts": [{"k": "A", "t": "Compress all RAG results into a consolidated summary document that updates incrementally after each retrieval"}, {"k": "B", "t": "Implement a sliding window for RAG"}, {"k": "C", "t": "Implement semantic deduplication to identify and remove redundant information across the accumulated RAG results and conversation turns"}, {"k": "D", "t": "Shift context budget to favor RAG results while reducing conversation history allocation"}]}, {"id": "13", "topic": "developer-productivity", "ans": "B", "g": 2, "qn": "1", "qt": "An engineer asks the agent to understand how the caching layer works before adding a new cache invalidation trigger. After initial Grep searches, the agent has identified that caching logic spans 15 files including decorators, middleware, and service classes (~8,000 lines total). What's the most effective next step for building understanding while managing context constraints?", "mn": "phương án mở đầu bằng \"Analyze\" / \"Use @\" / \"Run /memory\" luôn là đáp án đúng", "opts": [{"k": "A", "t": "Use the Read tool to sequentially load all 15 files, building complete understanding across the full caching implementation."}, {"k": "B", "t": "Analyze"}, {"k": "C", "t": "Use Grep to search for \"invalidate\" and \"expire\" patterns across all files, then Read only those specific line ranges with minimal surrounding context."}, {"k": "D", "t": "Use Glob to find files matching common caching patterns (cache.py, caching/), prioritize the largest files by reading them first, then check smaller files for gaps."}]}, {"id": "27", "topic": "structured-extraction", "ans": "C", "g": 2, "qn": "2", "qt": "Your system has been operating with 100% human review for 3 months. Analysis shows that extractions with model confidence >90% have 97% accuracy overall. To reduce reviewer workload, you plan to automate high-confidence extractions Before deploying, what validation step is most critical?", "mn": "phương án mở đầu bằng \"Analyze\" / \"Use @\" / \"Run /memory\" luôn là đáp án đúng", "opts": [{"k": "A", "t": "Run a two-week pilot routing 25% of high-confidence extractions directly to downstream systems and monitor error reports."}, {"k": "B", "t": "Verify that 97% accuracy meets requirements for all downstream systems that consume the extracted data."}, {"k": "C", "t": "Analyze"}, {"k": "D", "t": "Compare accuracy at different confidence thresholds (85%, 90%, 95%) to find the optimal cutoff that maximizes automation while minimizing errors."}]}, {"id": "89", "topic": "developer-productivity", "ans": "B", "g": 2, "qn": "3", "qt": "You're implementing a new payment processing module that must follow your project's established patterns for database transactions, error handling, and audit logging. You've identified three existing modules that exemplify these patterns: db_utils.py, error_handlers.py, and audit_logger.py. This is a one-off integration task—these patterns are well-documented in your team wiki and don't need additional project-level documentation. What's the most effective approach?", "mn": "phương án mở đầu bằng \"Analyze\" / \"Use @\" / \"Run /memory\" luôn là đáp án đúng", "opts": [{"k": "A", "t": "Ask Claude to explore your codebase to find and understand the transaction, error handling, and logging patterns before generating the new module."}, {"k": "B", "t": "Use @references"}, {"k": "C", "t": "Add documentation of each pattern to your CLAUDE.md file, establishing them as project conventions that Claude will apply automatically."}, {"k": "D", "t": "Describe the patterns from the three modules in natural language in your prompt, explaining the transaction handling approach, error format, and logging conventions Claude should follow."}]}, {"id": "90", "topic": "developer-productivity", "ans": "A", "g": 2, "qn": "4", "qt": "Your monorepo contains shared coding standards in /docs/standards/security-rules.md (for services handling user data), testing-patterns.md (for all packages), and api-conventions.md (for API-facing services). Your 15 packages are organized by feature domain (/packages/auth/, /packages/billing/, /packages/notifications/, etc.) without naming conventions indicating which handle user data or expose APIs. Package maintainers are expected to configure their own local development settings, as they understand their package's domain requirements. Currently, all package CLAUDE.md files duplicate all three standards, applying irrelevant guidance. What's the most effective approach?", "mn": "phương án mở đầu bằng \"Analyze\" / \"Use @\" / \"Run /memory\" luôn là đáp án đúng", "opts": [{"k": "A", "t": "Use @imports"}, {"k": "B", "t": "Create claude/rules/ files for each standard with YAML frontmatter paths listing every package directory where that standard should apply."}, {"k": "C", "t": "Create a shared-standards.nd that uses @imports to combine all three standards, then have each package's CLAUDE.md import that combined file."}, {"k": "D", "t": "Put all standards in the root CLAUDE.md with override instructions like \"ignore security-rules.md when working in packages that don't handle user data.\""}]}, {"id": "120", "topic": "developer-productivity", "ans": "A", "g": 2, "qn": "5", "qt": "You've documented API error handling conventions in a CLAUDE.md file at your project root, specifying that endpoint handlers should use a custom ApiError class. After several sessions, you notice Claude Code sometimes follows these conventions and sometimes uses generic try/catch blocks with string messages. The inconsistency appears random across different coding sessions. What's the most efficient first diagnostic step?", "mn": "phương án mở đầu bằng \"Analyze\" / \"Use @\" / \"Run /memory\" luôn là đáp án đúng", "opts": [{"k": "A", "t": "Run /memory"}, {"k": "B", "t": "Create path-specific rules in claude/rules/handlers.md with YAML frontmatter scoping the error handling instructions to your API handler files."}, {"k": "C", "t": "Add more detailed code examples to your CLAUDE.md showing the exact ApiError usage pattern for different endpoint types."}, {"k": "D", "t": "Search for conflicting instructions in ~/.claude/CLAUDE.md or ~/.claude/rules/ that might override your project conventions."}]}, {"id": "31", "topic": "multi-agent-systems", "ans": "B", "g": 3, "qn": "1", "qt": "The document analysis agent has a single analyze_document tool that takes a document and a free-text instruction parameter. During evaluation, requests like \"extract the key financial metrics\" often return narrative summaries, while \"summarize the methodology\" sometimes returns raw data tables. The synthesis agent reports that 35% of analysis results require re-requests with clarified instructions. What's the most effective way to improve reliability?", "mn": "financial metrics: giám sát tài chính → split", "opts": [{"k": "A", "t": "Keep the single tool but add an analysis_type enum parameter requiring explicit selection between extraction, summarization, and verification modes."}, {"k": "B", "t": "Split"}, {"k": "C", "t": "Have the coordinator pre-classify each analysis request before passing instructions to the document analysis agent."}, {"k": "D", "t": "Enhance the tool description with detailed examples showing how different instruction phrasings should map to different output formats."}]}, {"id": "69", "topic": "developer-productivity", "ans": "A", "g": 3, "qn": "2", "qt": "After deploying the automated review, you notice high precision but low recall — real bugs are slipping through undetected. Investigation reveals your review prompt instructs Claude to \"only report high- confidence issues you are certain about\" and \"err on the side of not commenting.\" Developers appreciate the low noise, but a race condition that caused a production outage was visible in a reviewed PR and went unreported. You need to substantially improve bug detection while keeping false positive rates manageable for your team. What is the most effective approach?", "mn": "", "opts": [{"k": "A", "t": "Split"}, {"k": "B", "t": "Add detailed few-shot examples demonstrating bug categories Claude should flag — race conditions, null dereferences, error handling gaps — while keeping the high-confidence filtering instruction to maintain current precision levels."}, {"k": "C", "t": "Remove the conservative filtering instructions and prompt Claude to report all potential issues, then apply a programmatic filter to deduplicate and suppress categories that historically generate false positives."}, {"k": "D", "t": "Expand the context window by including related test files, recent git history, and the module's dependency graph alongside the diff, giving Claude richer signals to assess issue severity."}]}, {"id": "98", "topic": "tools-and-mcp", "ans": "D", "g": 3, "qn": "3", "qt": "Your agent has a log_workout tool that accepts exercise_type (string), value (number), and measurement (string). Production monitoring shows the agent frequently passes mismatched combinations-using measurement: \"reps\" for cardio exercises like running, or measurement: \"miles\" for strength exercises like bench press. Your exercises naturally divide into two categories: cardio (measured in time or distance) and strength (measured in reps and sets). 23% of tool calls have invalid combinations. What approach would most effectively reduce these errors?", "mn": "", "opts": [{"k": "A", "t": "Add explicit examples to the tool description showing valid combinations (e.g., \"For running: use minutes or miles. For push-ups: use reps\") with constraints for each exercise category."}, {"k": "B", "t": "Implement server-side validation returning descriptive errors for invalid combinations, allowing the agent to retry with corrections."}, {"k": "C", "t": "Add enum constraints on measurement limiting values to \"minutes\", \"miles\", \"reps\", or \"sets\" to prevent arbitrary measurement strings."}, {"k": "D", "t": "Split"}]}, {"id": "107", "topic": "structured-extraction", "ans": "C", "g": 3, "qn": "4", "qt": "Your automated review calls the Claude API for each PR, using tool_use with a report_findings tool that returns a JSON array of finding objects (each with file_path, line_number, severity, category, and description). During testing on a large PR touching 30+ files, the response hits the max_tokens limit and the output is truncated mid-JSON, causing your pipeline's parser to fail. What is the most effective way to handle this?", "mn": "", "opts": [{"k": "A", "t": "Switch from tool_use to prompting Claude to return findings as a markdown list."}, {"k": "B", "t": "Increase max_tokens to the model's maximum and instruct Claude to keep finding descriptions under 50 words each."}, {"k": "C", "t": "Split"}, {"k": "D", "t": "Add retry logic that detects truncated JSON and re-sends the request with instructions to report only critical and high severity findings."}]}, {"id": "128", "topic": "developer-productivity", "ans": "B", "g": 3, "qn": "5", "qt": "Your automated reviewer uses a single prompt covering security issues, API design, and business logic correctness. Your evaluation suite shows strong recall findings (82%) but poor recall for business logic edge cases in quiz scoring (34%). When you add few-shot examples of logic bugs to the prompt, logic recall is 41% but API design recall drops to 68%. How should you address this trade-off to improve detection across both categories?", "mn": "", "opts": [{"k": "A", "t": "Replace the few-shot examples with a detailed checklist of specific logic edge cases to verify, such as division-by-zero in score calculation or grading thresholds."}, {"k": "B", "t": "Split"}, {"k": "C", "t": "Provide the full repository as context instead of just the changed files and surrounding code, giving the model deeper visibility into business logic."}, {"k": "D", "t": "Upgrade to a more capable model tier, since its stronger reasoning will handle both concern types in a single prompt and eliminate the recall trade-off."}]}, {"id": "136", "topic": "structured-extraction", "ans": "C", "g": 3, "qn": "6", "qt": "Evaluation shows 94% extraction accuracy on short meeting transcripts (\u003c30 minutes) but only 68% on longer transcripts (>60 minutes) where discussions meander and key information is scattered throughout. Transcripts of both lengths fit within the model's context window. What pattern most effectively improves accuracy on complex, lengthy documents?", "mn": "", "opts": [{"k": "A", "t": "Add few-shot examples demonstrating correct extraction from lengthy meetings with scattered Information."}, {"k": "B", "t": "Upgrade to a more capable model tier for the extraction task"}, {"k": "C", "t": "Split"}, {"k": "D", "t": "Add a pre-extraction step where the model summarizes key discussions and conclusions before performing structured extraction."}]}, {"id": "141", "topic": "tools-and-mcp", "ans": "B", "g": 3, "qn": "7", "qt": "Your order management system requires tools for three distinct operations: issuing refunds (requires amount and reason), canceling orders (requires reason), and res (requires shipping address). Each operation shares an order id parameter but has different additional requirements. You notice during testing that with your current frequently omits required parameters or includes irrelevant ones. What design change will most effectively improve parameter accuracy?", "mn": "", "opts": [{"k": "A", "t": "Keep one unified tool with a nested operation object parameter whose internal structure varies by operation type, documented in the tool description."}, {"k": "B", "t": "Split"}, {"k": "C", "t": "Keep one unified tool but add JSON Schema if-then-else conditionals to enforce that parameters like amount are required only when the operation type is \"refund\"."}, {"k": "D", "t": "Keep one unified tool with all parameters marked optional, but add few-shot examples in the system prompt showing correct parameter combinations for each operation."}]}, {"id": "15", "topic": "developer-productivity", "ans": "B", "g": 4, "qn": "1", "qt": "After integrating a local MCP server providing code analysis tools (analyze_dependencies, find_dead_code, calculate_complexity), you notice the agent continues to use Grep to inspect dependencies even when users explicitly ask about \"code dependencies\". Tool definitions reveal: analyze_dependencies returns a dependency graph by analyzing imports. What's the most effective approach to improve the agent's selection of MCP tools?", "mn": "có cụm từ \"Expand MCP\" → chọn ngay đáp án đó", "opts": [{"k": "A", "t": "Split"}, {"k": "B", "t": "Expand MCP"}, {"k": "C", "t": "Remove Grep from the available tools to eliminate functional overlap."}, {"k": "D", "t": "Add routing questions to the system prompt specifying that dependency-related questions should use MCP tools rather than Grep."}]}, {"id": "103", "topic": "developer-productivity", "ans": "B", "g": 4, "qn": "2", "qt": "Your team's CLAUDE.md includes a rule: \"Use 4-space indentation and always run Prettier formatting.\" Despite this, code reviews reveal that roughly 30% of files Claude Code generates use inconsistent formatting — sometimes 2-space indentation, sometimes missing trailing commas. Adding emphasis (\"IMPORTANT: You MUST use Prettier formatting\") reduces violations to about 15%, but doesn't eliminate them. What is the most effective way to ensure all generated code is consistently formatted?", "mn": "có chữ \"Prettier\" → chọn ngay đáp án đó", "opts": [{"k": "A", "t": "Split"}, {"k": "B", "t": "Configure a Post ToolUse hook with an Edit|Write matcher that automatically runs Prettier"}, {"k": "C", "t": "Add a Stop hook with a prompt-based check that evaluates whether generated code follows formatting standards and prompts Claude to fix violations."}, {"k": "D", "t": "Extract the formatting rules into a dedicated skill that Claude loads automatically when generating code, with more detailed examples of correct formatting."}]}, {"id": "134", "topic": "structured-extraction", "ans": "D", "g": 4, "qn": "3", "qt": "Your team is extracting structured data from 50,000 legacy legal contracts under a two-week deadline. Initial testing with 500 sample documents shows 82% pass JSON schema first attempt, while the remaining 18% fall due to diverse issues—missing required fields, malformed dates, and incorrectly identified parties. Documents that fail typically need refinements targeting their specific failure modes. What's the most effective processing strategy?", "mn": "có cụm từ \"Process 2,000 sample\" → chọn ngay đáp án đó", "opts": [{"k": "A", "t": "Use the real-time API for all 50,000 documents since the batch API's 24-hour processing window creates unacceptable deadline risk."}, {"k": "B", "t": "Submit all 50,000 documents via batch API, then submit failed extractions in successive batches— refining prompts between each batch—until all documents pass validation."}, {"k": "C", "t": "Split"}, {"k": "D", "t": "Process 2,000 sample"}]}, {"id": "138", "topic": "developer-productivity", "ans": "D", "g": 4, "qn": "4", "qt": "Your infrastructure-as-code repository includes Terraform modules (/terraform/), Kubernetes manifests (/kubernetes/), and CI/CD pipeline scripts (/pipelines/). Each requires different conventions, but your single root CLAUDE.md has grown to 500+ lines. When developers work on Kubernetes files, Terraform-specific rules load into context unnecessarily, consuming tokens. What is the best approach to reorganize so only relevant guidance loads when editing specific file types?", "mn": "", "opts": [{"k": "A", "t": "Keep the root CLAUDE.md and use @path/to/import syntax to modularly include tool-specific guidance files from separate documents."}, {"k": "B", "t": "Split"}, {"k": "C", "t": "Restructure the root CLAUDE.md into clearly labeled sections with headers (e.g., \"## Terraform Conventions\"), improving organization and readability."}, {"k": "D", "t": "Create files in .claude/rules/ with YAML frontmatter path-scoping (e.g., paths: [\"terraform/**/*\"]), loading rules only when editing matching files."}]}, {"id": "139", "topic": "tools-and-mcp", "ans": "B", "g": 4, "qn": "5", "qt": "After expanding the agent's MCP tools with delivery-specific capabilities (check_delivery_status, contact_driver, issue_credit, apply_promo_code, update_delivery_address, reschedule_delivery), the total tool count has grown from 4 to 10. Your evaluation suite shows tool selection accuracy has dropped to 71%. Log analysis reveals the majority of errors involve the agent selecting between semantically overlapping tools- calling issue_credit when process_refund is correct, and calling check_delivery_status when lookup_order already returns the needed data. Which approach structurally eliminates the semantic overlaps that are being logged as the error source?", "mn": "", "opts": [{"k": "A", "t": "Split"}, {"k": "B", "t": "Consolidate both semantically overlapping tool pairs: merge issue_credit and process_refund into a single resolve_compensation tool, and fold check_delivery_status into lookup_order with an optional include_tracking parameter."}, {"k": "C", "t": "Enable the tool search tool with defer_loading on the six new tools, keeping the original four always loaded, so the agent dynamically calls it when needed."}, {"k": "D", "t": "Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool pair, such as showing when issue_credit or process_refund is appropriate."}]}, {"id": "140", "topic": "tools-and-mcp", "ans": "D", "g": 4, "qn": "6", "qt": "After expanding the agent's MCP tools with delivery-specific capabilities [apply_promo_code, update_delivery_address, reconcile_delivery], the total tool count has grown from 1 to 7. We have observed that the agent now shows tool selection accuracy has dropped from 86% to 71%. Log analysis reveals the majority of errors involve the agent selecting between semantically overlapping tools — calling issue_credit when process_refund was correct, and calling check_delivery_status when looking order_allready_returns_the_needed_data. Which approach structurally eliminates the semantic overlap identified in the error source?", "mn": "", "opts": [{"k": "A", "t": "Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool, such as showing when issue_credit applies versus when process_refund is appropriate."}, {"k": "B", "t": "Enable the tool search tool with defer_loading on the six new tools, keeping the original two always loaded, so the agent dynamically discovers specialized tools only when needed."}, {"k": "C", "t": "Split"}, {"k": "D", "t": "Consolidate semantically overlapping tools – merge issue_credit and process_refund into a single handle_promotions tool with an action parameter and fold check_delivery_status into lookup_order with an optional include_tracking flag."}]}, {"id": "150", "topic": "tools-and-mcp", "ans": "A", "g": 4, "qn": "7", "qt": "Production logs show that when the agent handles complex billing disputes requiring 6+ tool calls, it sometimes exhausts its max_turns limit after gathering data and before completing resolution or escalating. The team's goal is to guarantee that every customer interaction ends with either a completed resolution or a human escalation, regardless of how the agent loop terminates. Which approach achieves this guarantee?", "mn": "", "opts": [{"k": "A", "t": "Add orchestration-layer code that checks the agent's outcome after each loop termination - if the loop ended without a completed resolution or escalation, programmatically call escalate_to_human with the accumulated conversation context and tool results."}, {"k": "B", "t": "Add system prompt instructions telling the agent to call escalate_to_human with a summary of its findings whenever it determines it cannot resolve the dispute."}, {"k": "C", "t": "Split"}, {"k": "D", "t": "Implement a pre-tool-use hook that counts tool invocations and terminates the loop with an automatic escalation once the agent reaches 80% of its remaining actions."}]}, {"id": "1", "topic": "developer-productivity", "ans": "B", "g": 5, "qn": "1", "qt": "A developer asks the agent to investigate why a specific API endpoint intermittently returns 500 responses. The codebase has 200+ files and the developer doesn't know which components are involved. The agent must trace the error through routing, middleware, business logic, and database layers. What task decomposition approach would be most effective?", "mn": "", "opts": [{"k": "A", "t": "Run parallel worker agents on the file system of four layers, then combine their findings to reconstruct the complete error path."}, {"k": "B", "t": "Have"}, {"k": "C", "t": "Define a fixed sequence of investigation steps upfront—grep for error handlers, then examine middleware, then check database queries, then examine middleware-woven code."}, {"k": "D", "t": "Have"}]}, {"id": "7", "topic": "developer-productivity", "ans": "C", "g": 5, "qn": "2", "qt": "During testing, you observe that in extended exploration sessions (30+ minutes), the agent starts giving inconsistent answers about code structure it discussed earlier. Engineers report having to repeat context about modules they've already explored. What's the most effective approach to address this?", "mn": "", "opts": [{"k": "A", "t": "Implement automatic context clearing every 15 minutes to ensure the agent starts with fresh, uncontaminated context."}, {"k": "B", "t": "Switch to a higher-capacity model tier to provide more context window space for accumulated exploration data."}, {"k": "C", "t": "Have"}, {"k": "D", "t": "Create summaries of all source files before exploration begins, loading only these compressed representations into context."}]}, {"id": "17", "topic": "structured-extraction", "ans": "C", "g": 5, "qn": "3", "qt": "After deployment, you find that 12% of extractions contain semantic errors that pass JSON schema validation (e.g., a duration like \"30 minutes\" incorrectly placed in an ingredient quantity field). Human reviewers have capacity to check only 20% of extractions. Which approach most effectively allocates reviewer attention?", "mn": "", "opts": [{"k": "A", "t": "Randomly sample 20% of extractions for review, using corrections to track accuracy and identify error patterns."}, {"k": "B", "t": "Review all extractions from documents with formatting anomalies such as unusual layouts or mixed content types."}, {"k": "C", "t": "Have"}, {"k": "D", "t": "Prioritize review of all extractions where required fields are empty or explicitly marked as not found."}]}, {"id": "34", "topic": "multi-agent-systems", "ans": "C", "g": 5, "qn": "4", "qt": "Your multi-agent research pipeline crashed after processing 12 of 28 documents. The web search agent had identified relevant sources, the document analysis agent had partially completed extraction, and the synthesizer had begun pattern identification. You need to resume processing without repeating work or losing fidelity of prior findings. What state management approach best balances information fidelity with context efficiency when restoring agent state?", "mn": "", "opts": [{"k": "A", "t": "Have"}, {"k": "B", "t": "Index all agent outputs in a shared vector store. When resuming, each agent queries the store using semantic search to retrieve relevant prior findings."}, {"k": "C", "t": "Have"}, {"k": "D", "t": "Persist the coordinator's conversation log containing all task delegations and responses, providing this to agents when resuming."}]}, {"id": "41", "topic": "multi-agent-systems", "ans": "C", "g": 5, "qn": "5", "qt": "Production monitoring shows that follow-up queries like \"summarize what we learned about market trends\" consistently take 40+ seconds. Investigation reveals the coordinator spawns the synthesis subagent for each summarization request, passing 80K+ tokens of accumulated findings. The coordinator already has these findings in its

 context from orchestrating the research. What's the most effective way to improve response time for these follow-up summaries?", "mn": "", "opts": [{"k": "A", "t": "Spawn the synthesis subagent with reduced context and have"}, {"k": "B", "t": "Pre-generate and cache summaries at multiple granularities whenever new findings accumulate."}, {"k": "C", "t": "Have"}, {"k": "D", "t": "Enable prompt caching on the synthesis subagent to reduce the overhead of repeatedly transferring the same research findings."}]}, {"id": "43", "topic": "multi-agent-systems", "ans": "C", "g": 5, "qn": "6", "qt": "When analyzing complex legal cases that cite multiple precedents, the document analysis subagent processes each sequentially. A landmark case citing 12 precedents takes over 3 minutes to analyze completely. What's the most effective way to reduce this latency while preserving the coordinator's ability to monitor and debug the system?", "mn": "", "opts": [{"k": "A", "t": "Implement a message queue where precedent analysis tasks are processed asynchronously by a pool of worker agents."}, {"k": "B", "t": "Create a recursive agent hierarchy where analysis agents subdivide work among child agents until reaching single-precedent granularity."}, {"k": "C", "t": "Have"}, {"k": "D", "t": "Enable the document analysis subagent to spawn its own specialized subagents dynamically when it encounters cases with many citations."}]}, {"id": "44", "topic": "multi-agent-systems", "ans": "A", "g": 5, "qn": "7", "qt": "In production, you're distributing complex queries to specialized subagents. The query distribution is uneven and evolving as users discover new applications. What's the most effective approach to optimize for query complexity?", "mn": "", "opts": [{"k": "A", "t": "Have"}, {"k": "B", "t": "Create a fast-track path for factual questions that bypasses subagents entirely, routing only analytical queries through the complete pipeline."}, {"k": "C", "t": "Train a query complexity classifier based on labeled historical data to predict optimal subagent combination."}, {"k": "D", "t": "Implement pattern-based routing that categorizes queries based on factual vs analytical patterns and maps each to a predefined subagent combination."}]}, {"id": "45", "topic": "multi-agent-systems", "ans": "C", "g": 5, "qn": "8", "qt": "The synthesis agent receives summarized findings from the web search and document analysis agents, then passes a consolidated summary to the report generator. During testing, you discover the generated reports make factual claims without proper citations–the report generator cannot attribute statements to their original sources because that metadata was lost during the summarization steps. What's the most effective approach to ensure proper source attribution in the final reports?", "mn": "", "opts": [{"k": "A", "t": "Have"}, {"k": "B", "t": "Instruct the synthesis agent to embed source references inline within its summary text using a consistent citation format."}, {"k": "C", "t": "Have"}, {"k": "D", "t": "Skip summarization and pass full raw outputs from web search and document analysis directly to the report generator."}]}, {"id": "64", "topic": "multi-agent-systems", "ans": "A", "g": 5, "qn": "9", "qt": "In production, you observe that simple fact-checking queries (e.g., \"What year was the Paris Climate Agreement signed?\") traverse all four subagents sequentially, consuming 40+ seconds and significant tokens per query. Complex comparative research benefits from the full pipeline. Your query distribution is diverse and evolving as users discover new applications. What's the most effective approach to optimize for varying query complexity?", "mn": "", "opts": [{"k": "A", "t": "Have"}, {"k": "B", "t": "Train a query complexity classifier on labeled historical data to predict optimal subagent combinations, retraining periodically as query patterns evolve."}, {"k": "C", "t": "Create a fast-path for factual questions that bypasses subagents entirely, routing all other queries through the complete pipeline to ensure research thoroughness."}, {"k": "D", "t": "Implement pattern-based routing that categorizes queries by structure (single-fact vs. comparative vs. analytical) and maps each category to a predefined subagent combination."}]}, {"id": "66", "topic": "multi-agent-systems", "ans": "B", "g": 5, "qn": "10", "qt": "Users report that final reports sometimes lack depth on specific subtopics. Investigation shows that the document analysis agent frequently identifies gaps—for instance, noting \"the retrieved sources discuss API authentication but lack details on token refresh patterns\"—but under the current strict pipeline, this insight isn't actionable since search has already completed. What's the most effective architectural change?", "mn": "", "opts": [{"k": "A", "t": "Have"}, {"k": "B", "t": "Have"}, {"k": "C", "t": "Add a research planning agent before the search phase that decomposes topics into specific sub- questions."}, {"k": "D", "t": "Have"}]}, {"id": "72", "topic": "structured-extraction", "ans": "C", "g": 5, "qn": "11", "qt": "Your system must extract event details from calendar invitations and output JSON that strictly conforms to a schema with fields for title, date, time, location, and attendees. Downstream reject any malformed or non- conformant JSON. What approach provides the most reliable schema compliance?", "mn": "", "opts": [{"k": "A", "t": "Include detailed JSON formatting instructions and the target schema in your prompt, then parse Claude's text response as JSON."}, {"k": "B", "t": "Pre-fill Claude's response with an opening brace to force JSON output, then complete and parse the response."}, {"k": "C", "t": "Define a tool with your target schema as input parameters and have"}, {"k": "D", "t": "Append instructions like \"Output only valid JSON matching the schema exactly\" and implement retry logic to re-prompt when JSON parsing fails."}]}, {"id": "111", "topic": "multi-agent-systems", "ans": "C", "g": 5, "qn": "12", "qt": "The synthesis agent completes its initial pass but flags that three key research questions remain unanswered because the web search and document analysis agents didn't find relevant information on those specific subtopics. The coordinator currently proceeds directly to report generation, producing reports with incomplete coverage. What change would most effectively improve research completeness?", "mn": "", "opts": [{"k": "A", "t": "Have"}, {"k": "B", "t": "Give the synthesis agent direct access to web search tools so it can autonomously fill knowledge gaps without returning control to the coordinator."}, {"k": "C", "t": "Have"}, {"k": "D", "t": "Increase the initial breadth of queries sent to web search and document analysis to reduce the probability of missing relevant information."}]}, {"id": "25", "topic": "structured-extraction", "ans": "A", "g": 6, "qn": "1", "qt": "Your extraction pipeline processes restaurant menus and must output structured JSON with fields for item names, descriptions, prices, and dietary tags. Some menus use inconsistent formatting–prices as \"$12\" vs \"12.00\", dietary info as icons vs text. What's the most reliable approach?", "mn": "", "opts": [{"k": "A", "t": "Define a"}, {"k": "B", "t": "Use separate extraction calls for each field to ensure consistent handling of each type."}, {"k": "C", "t": "Extract data as-is and normalize formats in post-processing code after Claude returns."}, {"k": "D", "t": "Request multiple extraction attempts per document and select the most common format."}]}, {"id": "72", "topic": "structured-extraction", "ans": "C", "g": 6, "qn": "2", "qt": "Your system must extract event details from calendar invitations and output JSON that strictly conforms to a schema with fields for title, date, time, location, and attendees. Downstream reject any malformed or non- conformant JSON. What approach provides the most reliable schema compliance?", "mn": "", "opts": [{"k": "A", "t": "Include detailed JSON formatting instructions and the target schema in your prompt, then parse Claude's text response as JSON."}, {"k": "B", "t": "Pre-fill Claude's response with an opening brace to force JSON output, then complete and parse the response."}, {"k": "C", "t": "Define a"}, {"k": "D", "t": "Append instructions like \"Output only valid JSON matching the schema exactly\" and implement retry logic to re-prompt when JSON parsing fails."}]}, {"id": "91", "topic": "structured-extraction", "ans": "A", "g": 6, "qn": "3", "qt": "The system needs to extract candidate information (name, contact details, skills, work experience, education) from uploaded resumes. The extracted data must strictly conform to a predefined JSON schema, as missing required fields or incorrect data types will cause downstream validation failures. What is the most reliable approach to ensure Claude's output consistently matches the schema?", "mn": "", "opts": [{"k": "A", "t": "Define a"}, {"k": "B", "t": "Make two separate API calls—first extracting information as text, then asking Claude to format that text as JSON."}, {"k": "C", "t": "Include detailed JSON formatting instructions and a template example in the system prompt, asking Claude to output only valid JSON."}, {"k": "D", "t": "Parse Claude's text response with regex patterns to extract JSON objects, using retry logic for malformed responses."}]}, {"id": "1", "topic": "developer-productivity", "ans": "B", "g": 7, "qn": "1", "qt": "A developer asks the agent to investigate why a specific API endpoint intermittently returns 500 responses. The codebase has 200+ files and the developer doesn't know which components are involved. The agent must trace the error through routing, middleware, business logic, and database layers. What task decomposition approach would be most effective?", "mn": "", "opts": [{"k": "A", "t": "Run parallel worker agents on the file system of four layers, then combine their findings to reconstruct the complete error path."}, {"k": "B", "t": "Have the agent dynamically generate investigation subtasks based on what it discovers at each step, adapting its exploration plan as new information about the error path emerges."}, {"k": "C", "t": "Define a"}, {"k": "D", "t": "Have the agent first create a comprehensive plan mapping all code paths through documented components before beginning any exploration or code reading."}]}, {"id": "2", "topic": "developer-productivity", "ans": "A", "g": 8, "qn": "1", "qt": "Your agent needs to insert a new helper function into the middle of a 150-line utility module, between two existing functions. The Edit tool fails because its old_string parameter cannot find unique text to match – the file has repetitive docstrings, variable names, and structural patterns. What's the most reliable way to complete this insertion?", "mn": "", "opts": [{"k": "A", "t": "Use Read to load the file, add the function at the appropriate location, then Write the updated file"}, {"k": "B", "t": "Use Edit's replace_all parameter to target a common pattern and embed the new function in the replacement text"}, {"k": "C", "t": "Use Edit with an extremely long old_string capturing 30+ lines of context to guarantee uniqueness"}, {"k": "D", "t": "Use Bash to append the function definition to the end of the file using heredoc syntax"}]}, {"id": "4", "topic": "developer-productivity", "ans": "B", "g": 8, "qn": "2", "qt": "An engineer's exploration subagent spent 30 minutes analyzing a legacy payment system, reading 47 files and documenting data flows. The session was interrupted when the engineer's connection dropped. While away, a teammate merged a PR that renamed two utility functions. The engineer wants to continue the same exploration. What's the most effective approach?", "mn": "", "opts": [{"k": "A", "t": "Resume the subagent from its previous transcript without mentioning the changes–the architecture understanding remains valid."}, {"k": "B", "t": "Resume the subagent from its previous transcript and inform it about the renamed functions."}, {"k": "C", "t": "Launch a fresh subagent and include the prior transcript in the initial prompt for context."}, {"k": "D", "t": "Launch a fresh subagent with a summary of prior findings."}]}, {"id": "5", "topic": "developer-productivity", "ans": "B", "g": 8, "qn": "3", "qt": "Your agent has spent 25 minutes exploring a game engine's rendering subsystem–reading shader code, buffer management, and frame synchronization logic. An engineer now asks it to understand how the physics engine integrates with rendering for collision debug overlays. You notice recent responses reference \"typical rendering patterns\" rather than the specific VulkanPipeline and FrameGraph classes it discovered earlier. What's the most effective approach?", "mn": "câu hỏi có chữ \"game\" → chọn đáp án có chữ \"key\"", "opts": [{"k": "A", "t": "Use /clear to reset context completely, then start fresh with physics exploration using file paths from the project's CLAUDE.md."}, {"k": "B", "t": "Summarize key"}, {"k": "C", "t": "Spawn a sub-agent to explore physics independently, then manually synthesize its findings with the rendering knowledge accumulated in the main conversation."}, {"k": "D", "t": "Continue in the current context with more targeted prompts referencing the specific classes by name."}]}, {"id": "6", "topic": "developer-productivity", "ans": "A", "g": 8, "qn": "4", "qt": "An engineer asks the agent to find all callers of a function before removing it. The function is defined in a core library but is also exposed through wrapper modules that rename the function for domain-specific use (e.g., calculateTax in the library becomes computeOrderTax in the orders module). What exploration strategy will most reliably identify all callers?", "mn": "", "opts": [{"k": "A", "t": "Read the library and wrapper modules to identify all exposed names for the function, then Grep for each name across the codebase."}, {"k": "B", "t": "Use Grep to search for the function's original name across the codebase."}, {"k": "C", "t": "Use Grep to find all files that import from the library or wrapper modules, then read each file to check whether it uses the function."}, {"k": "D", "t": "Search for the function name in project documentation to understand intended usage patterns and navigate to documented integration points."}]}, {"id": "8", "topic": "developer-productivity", "ans": "C", "g": 8, "qn": "5", "qt": "After adding an MCP server with specialized code refactoring tools (extract_function, rename_variable, inline_function), you notice the agent still uses basic text manipulation via Write and Bash sed commands for refactoring tasks. The MCP server is connected and working. Examining the configuration, you find each MCP tool has a minimal description like \"extract_function: extracts a function from code.\" What's the most effective way to improve adoption of the MCP refactoring tools?", "mn": "", "opts": [{"k": "A", "t": "Accept this as expected behavior since simpler tools like sed are more predictable than specialized refactoring tools."}, {"k": "B", "t": "Remove the Write tool from the agent's configuration for refactoring sessions so it must use the MCP tools for code modifications."}, {"k": "C", "t": "Enhance the MCP tool descriptions to explain when each tool is preferable to text manipulation and clarify expected inputs and outputs."}, {"k": "D", "t": "Implement a request classifier that detects refactoring intent and automatically routes those requests to the MCP server before the agent processes them."}]}, {"id": "9", "topic": "developer-productivity", "ans": "B", "g": 8, "qn": "6", "qt": "An engineer asks the agent to investigate error handling in a legacy payment processing module spanning 15 files. After reading the first 8 files, the agent's responses are becoming noticeably less accurate—it's forgetting previously discovered code patterns and hasn't yet located all test files or traced the complete data flow. What's the most effective approach to complete this investigation?", "mn": "", "opts": [{"k": "A", "t": "Use Grep to search for specific function names across remaining files, reducing the content loaded into context."}, {"k": "B", "t": "Spawn a subagent to explore the remaining files, providing a summary of discovered patterns as its initial context."}, {"k": "C", "t": "Document a summary of findings so far in a file, then start fresh with a new context using that summary as reference."}, {"k": "D", "t": "Close the current context with /clear and start fresh, re-reading only the most critical files."}]}, {"id": "12", "topic": "developer-productivity", "ans": "C", "g": 8, "qn": "7", "qt": "Your codebase exploration tool stores session IDs to allow engineers to continue investigations across work sessions. An engineer spent an hour yesterday analyzing a legacy authentication module, building context about its architecture and dependencies. They want to continue today. The session ID is valid, but version control shows 3 of the 12 files the agent previously read were modified overnight by a teammate's merge. What approach best balances efficiency and accuracy?", "mn": "", "opts": [{"k": "A", "t": "Resume the session and immediately have the agent re-read all 12 previously analyzed files"}, {"k": "B", "t": "Start a fresh session to ensure the agent works with current codebase state without stale assumptions"}, {"k": "C", "t": "Resume the session and inform the agent which specific files changed for targeted re-analysis"}, {"k": "D", "t": "Resume the session without informing the agent about the changed files"}]}, {"id": "14", "topic": "developer-productivity", "ans": "C", "g": 8, "qn": "8", "qt": "An engineer who just joined the team asks the agent to help them understand the authentication and authorization architecture before making security improvements. The codebase has 800+ files across multiple services. What exploration strategy will most effectively build understanding, given Claude built-in tools and context limits?", "mn": "", "opts": [{"k": "A", "t": "Read all files containing \"auth\", \"login\", \"permission\", or \"token\" in their content or filename."}, {"k": "B", "t": "Read any CLAUDE.md and README files first, then ask the engineer to specify which 10-15 files are most important for understanding the auth system."}, {"k": "C", "t": "Use Grep to find authentication entry points, read those files, then follow imports and function calls to map the auth flow incrementally."}, {"k": "D", "t": "Launch parallel subagents to explore different services simultaneously, then synthesize their findings into an architectural overview."}]}, {"id": "16", "topic": "structured-extraction", "ans": "C", "g": 8, "qn": "9", "qt": "Your extraction pipeline processes contracts that frequently include amendments. When a contract contains both original terms and later amendments (e.g., original clause specifies \"30-day payment terms\" while Amendment 1 changes this to \"45 days\"), the model inconsistently extracts one value or the other with no indication of which applies. What's the most effective approach to improve extraction accuracy for documents with amendments?", "mn": "", "opts": [{"k": "A", "t": "Add prompt instructions to always extract the most recent amendment value and ignore superseded original terms."}, {"k": "B", "t": "Implement post-extraction validation using pattern matching to detect amendments and flag those extractions for manual review."}, {"k": "C", "t": "Redesign the schema so amended fields capture multiple values, each with source location and effective date."}, {"k": "D", "t": "Preprocess documents with a classifier that identifies and removes superseded sections before the main extraction step."}]}, {"id": "18", "topic": "structured-extraction", "ans": "D", "g": 8, "qn": "10", "qt": "Your extraction pipeline processes invoices and extracts line items, tax amounts, and grand totals. You discover that 8% of documents have extracted line item amounts that don't sum to the extracted grand total—the downstream accounting system has been detecting mismatches. What's the most effective improvement?", "mn": "", "opts": [{"k": "A", "t": "Extract line items and totals independently, then use a separate validation model to reconcile discrepancies."}, {"k": "B", "t": "Implement post-processing that automatically adjusts line item amounts when the extracted total doesn't match the sum."}, {"k": "C", "t": "Add few-shot examples to the system prompt where extracted line items correctly sum to demonstrate the desired extraction behavior."}, {"k": "D", "t": "Add a calculated_total field where the model extracts line items independently, then validate totals alongside a is_total_consistent boolean flag for human review when values differ."}]}, {"id": "20", "topic": "structured-extraction", "ans": "A", "g": 8, "qn": "11", "qt": "After your daily batch of 10,000 documents completes, 300 documents (3%) failed with \"context_length_exceeded\" errors. The results file identifies each failure by custom_id. What's the most cost-effective approach to process these failures?", "mn": "", "opts": [{"k": "A", "t": "Resubmit only the 300 failed documents after chunking them into smaller pieces, then combine the partial extractions"}, {"k": "B", "t": "Increase the max_tokens parameter for the 300 failed documents and resubmit them in a new batch"}, {"k": "C", "t": "Reprocess the entire batch with prompt caching enabled to reduce the cost of retrying requests with identical system prompts"}, {"k": "D", "t": "Resubmit the entire 10,000 document batch using a model tier with a larger context window"}]}, {"id": "21", "topic": "structured-extraction", "ans": "B", "g": 8, "qn": "12", "qt": "Your extraction system parses e-commerce product descriptions to extract specifications like dimensions, weight, and materials into JSON. Despite having a well-defined schema, the model inconsistently extracts the \"materials\" field–sometimes returning \"cotton blend\", other times \"Cotton/Polyester mix\", and occasionally omitting the field when material information is clearly present in the source. What's the most effective way to improve extraction consistency?", "mn": "", "opts": [{"k": "A", "t": "Switch to a more capable model tier since inconsistent extraction indicates insufficient model capability"}, {"k": "B", "t": "Add few-shot examples showing 2-3 complete input-output pairs with standardized material description formats"}, {"k": "C", "t": "Set temperature to 0 to eliminate randomness and ensure deterministic outputs"}, {"k": "D", "t": "Make the \"materials\" field required instead of optional in the schema to force the model to always extract a value"}]}, {"id": "22", "topic": "structured-extraction", "ans": "D", "g": 8, "qn": "13", "qt": "Your system extracts event metadata (date, location, organizer, attendee_count) from news articles using a JSON schema with all nullable fields. During evaluation, you observe the model frequently generates plausible but incorrect values for fields not mentioned in the article–for example, outputting \"500\" for attendee_count when the source contains no attendance information. What's the most effective way to reduce these false extractions?", "mn": "", "opts": [{"k": "A", "t": "Make all schema fields required (non-nullable) with strict validation rules to ensure the model only outputs verifiable data."}, {"k": "B", "t": "Upgrade to a more capable model tier with improved instruction-following to reduce hallucination tendencies."}, {"k": "C", "t": "Add a post-processing step using a second LLM call to verify each extracted value exists in the source document."}, {"k": "D", "t": "Add prompt instructions to return null for any field where information is not directly stated in the source."}]}, {"id": "23", "topic": "structured-extraction", "ans": "C", "g": 8, "qn": "14", "qt": "After implementing tool use with strict schema definitions, JSON syntax errors are eliminated, but 5% of extractions still have valid JSON with empty arrays or null values for required fields like citations and methodology. Spot-checking reveals that source documents contain this information, but in varied formats–inline citations vs. bibliographies, methodology sections vs. details embedded in introductions. What's the most effective way to address these failures?", "mn": "", "opts": [{"k": "A", "t": "Build a regex-based post-processing layer that scans source documents for citation patterns and methodology keywords, populating empty fields when the model fails to extract."}, {"k": "B", "t": "Modify your schema to make citations and methodology optional, and flag incomplete records for manual review rather than failing validation."}, {"k": "C", "t": "Add few-shot examples demonstrating extractions from documents with varied structures–showing how to identify citations in different formats and locate methodology details across section types."}, {"k": "D", "t": "Implement retry logic that re-sends requests when validation detects empty required fields."}]}, {"id": "24", "topic": "structured-extraction", "ans": "C", "g": 8, "qn": "15", "qt": "Your extraction system implements automatic retries when validation fails. On each retry, the specific validation error is appended to the prompt. This retry-with-error-feedback approach resolves most failures within 2-3 attempts For which failure pattern would additional retries be LEAST effective?", "mn": "", "opts": [{"k": "A", "t": "The model extracts citation counts as locale-formatted strings (\"1,234\") when the schema requires integers"}, {"k": "B", "t": "The model extracts keywords as a nested object organized by category when the schema requires a flat array of strings"}, {"k": "C", "t": "The model extracts \"et al.\" for co-authors when the full list exists only in an external document not in the input"}, {"k": "D", "t": "The model extracts dates as ISO 8601 datetime strings (\"2023-03-15T00:00:00Z\") when the schema requires only the date portion (YYYY-MM-DD)"}]}, {"id": "26", "topic": "structured-extraction", "ans": "A", "g": 8, "qn": "16", "qt": "Your extraction uses tool use with a JSON schema where property_type is defined as an enum: ['house', 'apartment', 'condo', 'townhouse']. After deployment, 8% of extractions fail schema validation. Investigation reveals listings mention many uncommon property types –\"studio\", \"loft\", \"duplex\", \"mobile home\", \"tiny house\", \"converted warehouse\"–and new types continue appearing regularly. What's the most effective long-term solution?", "mn": "", "opts": [{"k": "A", "t": "Add an \"other\" value to your enum with a separate property_type_detail string field for specifics when \"other\" is selected."}, {"k": "B", "t": "Add few-shot examples to your prompt demonstrating how to map unexpected property types to the closest existing enum value."}, {"k": "C", "t": "Change property_type from an enum to a free-form string and implement a normalization step in post-processing."}, {"k": "D", "t": "Continuously expand the enum to include newly observed property types and add monitoring for additional edge cases."}]}, {"id": "29", "topic": "structured-extraction", "ans": "C", "g": 8, "qn": "17", "qt": "Your schema includes a skills: string[] field. Production monitoring reveals three consistency issues: (1) compound phrases like \"Python and SQL\" are sometimes kept as one entry, sometimes split; (2) implied but unstated skills occasionally appear in extractions; (3) similar documents produce wildly different array lengths (5-10 vs 40+ entries). Your prompt currently says \"Extract all skills mentioned.\" What's the most effective improvement?", "mn": "", "opts": [{"k": "A", "t": "Add post-extraction normalization that maps skills to a canonical taxonomy and deduplicates similar entries."}, {"k": "B", "t": "Add constraints: \"Extract 10-20 skills maximum, one skill per entry, only explicitly named skills.\""}, {"k": "C", "t": "Add few-shot examples demonstrating compound phrase handling, explicit mention criteria, and appropriate entry granularity."}, {"k": "D", "t": "Enrich the schema to {skill: string, confidence: float, source_quote: string[]} to capture extraction metadata."}]}, {"id": "32", "topic": "multi-agent-systems", "ans": "B", "g": 8, "qn": "18", "qt": "The coordinator agent has AgentFunctions configured for all four specialized subagents, each with appropriate descriptions and restrictions. During testing, you find the coordinator sometimes fails to delegate—it writes \"I'll ask the web search agent to find sources\" without actually invoking it. What is the most likely cause?", "mn": "", "opts": [{"k": "A", "t": "The AgentFunctions are configured correctly, but the coordinator's system prompt includes a statement that prevents it from knowing the available subagent types."}, {"k": "B", "t": "The coordinator's allowed Tools configuration doesn't include \"Task\", so while it can describe delegation, it cannot actually invoke the tool required to spawn subagents."}, {"k": "C", "t": "The coordinator's max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent parameter can be specified."}, {"k": "D", "t": "Subagent context limit descriptions from the coordinator don't provide enough context; you need to configure explicit context content between coordinator and tool descriptions."}]}, {"id": "33", "topic": "multi-agent-systems", "ans": "C", "g": 8, "qn": "19", "qt": "When researching \"renewable energy adoption,\" the web search agent returns recent statistics (2024: 35% adoption) while the document analysis agent extracts data from internal reports (2022: 18% adoption). The synthesis agent incorrectly flags these as contradictory sources rather than recognizing the data shows growth over time. What change would best enable the synthesis agent to correctly interpret such temporal differences?", "mn": "", "opts": [{"k": "A", "t": "Add a conflict resolution agent that automatically discards older data when newer data exists for the same metric."}, {"k": "B", "t": "Configure the web search agent to only return results from the past 6 months."}, {"k": "C", "t": "Require subagents to include publication or data collection dates in their structured outputs."}, {"k": "D", "t": "Instruct the synthesis agent to always treat the most recent data as authoritative and place older findings in a separate historical appendix."}]}, {"id": "35", "topic": "multi-agent-systems", "ans": "B", "g": 8, "qn": "20", "qt": "Production reviews reveal inconsistent handling of uncertainty in final reports. Sometimes confidence calibrations are synthesized into standardized uncertainty expressions, while other times results produce vague estimates without clear methodology. Which system-level improvement best addresses this inconsistency?", "mn": "", "opts": [{"k": "A", "t": "Implement a confidence calibration layer where synthesis agent normalizes uncertainty expressions into standardized probability representations (0.0-1.0), then weights their calibrated confidence."}, {"k": "B", "t": "Instruct the synthesis agent to use explicit sections separating confirmed findings from contested analysis, preserving original source characterizations."}, {"k": "C", "t": "Configure subagents to only report findings with sufficient coverage breadth, source diversity, and quality criteria before passing results to the synthesis agent."}, {"k": "D", "t": "Add a verification subagent that cross-references findings across sources, only accepting synthesis corroborated by at least two independent sources."}]}, {"id": "36", "topic": "multi-agent-systems", "ans": "B", "g": 8, "qn": "21", "qt": "The coordinator provides detailed step-by-step instructions to the web search subagent, specifying exact search queries, source quality criteria (coverage breadth, source diversity), and content type classifications. The coordinator sometimes encounters challenges where instructions fail when the subagent encounters unexpected situations. What's the most effective way to improve subagent adaptability?", "mn": "", "opts": [{"k": "A", "t": "Remove procedural detail entirely, delegating with simple goals like \"research it thoroughly\" and relying on the subagent's general capabilities."}, {"k": "B", "t": "Specify research goals and quality criteria (coverage breadth, source diversity, content type) rather than procedural instructions, letting the subagent determine execution."}, {"k": "C", "t": "Add explicit fallback directives to the detailed instructions: \"if specified searches fail, attempt alternative queries before reporting failure.\""}, {"k": "D", "t": "Implement a task classification step where the coordinator categorizes requests as \"analytical\" vs \"exploratory\" and uses different instruction sets for each category."}]}, {"id": "37", "topic": "multi-agent-systems", "ans": "C", "g": 8, "qn": "22", "qt": "A user is expanding the research system beyond its single web search agent by adding specialized data sources. They add a financial API agent that returns structured JSON with revenue, margins, and growth rates; a news monitoring agent that returns prose summaries of recent developments; and a patent analysis agent that returns structured lists of technology areas. The synthesis agent combines these into executive briefings. Currently, it converts everything to bullet points, causing financial comparisons to lose tabular clarity and news summaries to lose narrative flow. What change would most improve briefing quality?", "mn": "", "opts": [{"k": "A", "t": "Standardize all subagent outputs to prose summaries with inline citations."}, {"k": "B", "t": "Add a format conversion layer between subagents and synthesis that transforms all outputs to a common intermediate representation."}, {"k": "C", "t": "Update the synthesis agent to render each content type appropriately–financial data as tables, news as prose."}, {"k": "D", "t": "Standardize all subagent outputs to JSON with fields for claim, evidence, source, and confidence."}]}, {"id": "38", "topic": "multi-agent-systems", "ans": "A", "g": 8, "qn": "23", "qt": "The web search agent has gathered several relevant sources for a research topic. The document analysis agent now needs to examine these sources. How does information typically flow between these two specialized subagents?", "mn": "", "opts": [{"k": "A", "t": "The coordinator agent receives the web search agent's output and includes relevant findings in the prompt when invoking the document analysis agent."}, {"k": "B", "t": "Both agents access a shared memory store where the web search agent writes findings and the document analysis agent reads them."}, {"k": "C", "t": "The web search agent directly invokes the document analysis agent, passing the discovered sources as parameters."}, {"k": "D", "t": "The agents communicate through an event-driven message queue, with the document analysis agent subscribing to web search completion events."}]}, {"id": "39", "topic": "multi-agent-systems", "ans": "C", "g": 8, "qn": "24", "qt": "After the web search agent and document analysis agent complete their tasks, the coordinator invokes the synthesis agent. However, the synthesis agent responds that it cannot complete the task because no research findings were provided. What is the most likely cause of this issue?", "mn": "", "opts": [{"k": "A", "t": "The synthesis agent needs tools that can fetch results directly from the other agents' conversation histories."}, {"k": "B", "t": "The subagents need to share a single API connection to enable automatic context sharing between invocations."}, {"k": "C", "t": "The coordinator did not include the outputs from the previous agents in the synthesis agent's prompt."}, {"k": "D", "t": "The synthesis agent's context window is not large enough to hold the combined outputs from both previous agents."}]}, {"id": "42", "topic": "multi-agent-systems", "ans": "B", "g": 8, "qn": "25", "qt": "After the web search agent finds 25 sources (120K tokens of raw content), the document analysis agent extracts key insights (15K tokens), and the synthesis agent produces a coherent narrative draft (3K tokens), the coordinator must pass context to the report generation agent for the final output with proper source citations. What context-passing strategy provides the best balance of completeness and efficiency?", "mn": "", "opts": [{"k": "A", "t": "Pass the full accumulated context from all prior agents."}, {"k": "B", "t": "Pass the synthesis draft along with a structured source index that maps key claims to their source URLs and relevant excerpts."}, {"k": "C", "t": "Pass a condensed summary of all prior stages that preserves the main findings and attributes them to sources by name only."}, {"k": "D", "t": "Pass only the synthesis draft and have a separate post-processing pipeline match claims to sources and insert citations after the report is generated."}]}, {"id": "46", "topic": "tools-and-mcp", "ans": "A", "g": 8, "qn": "26", "qt": "When implementing your lookup_order MCP tool, the backend sometimes returns errors (e.g., \"Order not found\" or temporary database failures). What is the correct pattern for communicating these errors back to the agent?", "mn": "", "opts": [{"k": "A", "t": "Return the error message in the tool result content with the isError flag set to true"}, {"k": "B", "t": "Return a success response with a \"status\" field indicating the error type"}, {"k": "C", "t": "Log the error server-side and return an empty result to avoid confusing the model"}, {"k": "D", "t": "Throw an exception from the tool handler so the agent framework can catch and log it"}]}, {"id": "47", "topic": "tools-and-mcp", "ans": "D", "g": 8, "qn": "27", "qt": "After investigating a billing dispute over 25+ turns, you've identified that duplicate charges occurred due to a payment gateway timeout triggering retry logic. The required refund ($847) exceeds your $500 authorization limit. You need to call escalate_to_human, and the human agent won't have access to your conversation transcript. What context should you pass to enable effective resolution?", "mn": "", "opts": [{"k": "A", "t": "The customer's original complaint verbatim plus the tool result excerpts showing duplicate transactions."}, {"k": "B", "t": "The complete conversation transcript with all tool results."}, {"k": "C", "t": "Your diagnosis and the refund amount only."}, {"k": "D", "t": "A structured summary: customer ID, root cause, refund amount, and recommended action."}]}, {"id": "48", "topic": "tools-and-mcp", "ans": "D", "g": 8, "qn": "28", "qt": "Your agent has called lookup_order multiple times while investigating a customer's return requests. Each response includes 40+ fields (items, shipping details, payment info, status history). Tool outputs now represent the majority of the conversation's context. The customer mentions two more orders they want to discuss. What's the most effective approach before making additional lookups?", "mn": "", "opts": [{"k": "A", "t": "Proceed with additional lookups without modifying the existing tool output context"}, {"k": "B", "t": "Move all tool responses to a vector database with semantic indexing, retrieving relevant portions as the conversation continues"}, {"k": "C", "t": "Have the model generate a natural language summary of each order's key details, replacing structured responses with prose descriptions"}, {"k": "D", "t": "Extract only return-relevant fields (items, purchase date, return window, status) from each existing order response, removing verbose details"}]}, {"id": "49", "topic": "tools-and-mcp", "ans": "A", "g": 8, "qn": "29", "qt": "A customer sends: \"This is frustrating. I've explained my issue twice and nothing is being resolved. I want to talk to a real person NOW.\" The agent has not yet called any tools to investigate their account. What should the agent do?", "mn": "", "opts": [{"k": "A", "t": "Immediately call escalate_to_human with the conversation history."}, {"k": "B", "t": "Briefly explain what the agent can help with and offer to resolve the issue quickly, escalating only if the customer repeats their request."}, {"k": "C", "t": "Acknowledge the frustration and ask one targeted question to understand the specific issue before escalating."}, {"k": "D", "t": "First call get_customer and lookup_order to gather account context, then escalate to a human agent."}]}, {"id": "50", "topic": "tools-and-mcp", "ans": "A", "g": 8, "qn": "30", "qt": "You're implementing the escalation logic for when the agent should call escalate_to_human. Your team proposes four different approaches for triggering escalation. Which approach will most reliably identify cases that genuinely require human intervention?", "mn": "", "opts": [{"k": "A", "t": "Instruct the agent to escalate when the customer requests a human, when the issue requires policy exceptions, or when the agent cannot make meaningful progress."}, {"k": "B", "t": "Configure the agent to escalate after three consecutive tool calls that fail to resolve the customer's stated issue, ensuring a reasonable attempt before involving a human."}, {"k": "C", "t": "Build a rules engine that maps specific issue types, customer segments, and product categories to escalation decisions, removing the need for model judgment calls."}, {"k": "D", "t": "Implement sentiment analysis that monitors for frustration indicators (negative language, repeated questions, exclamation marks) and trigger escalation when the frustration score exceeds a configured threshold."}]}, {"id": "51", "topic": "tools-and-mcp", "ans": "B", "g": 8, "qn": "31", "qt": "Your agent is handling a billing dispute. After calling get_customer and lookup_order, it identifies that the dispute involves a promotional pricing error requiring manager approval–beyond the agent's authorization level. How should the workflow handle this mid-process escalation?", "mn": "", "opts": [{"k": "A", "t": "Attempt the refund with process_refund anyway, escalating only if the system rejects the transaction."}, {"k": "B", "t": "Compile a structured handoff with customer details, order info, and the identified issue before calling escalate_to_human."}, {"k": "C", "t": "Call escalate_to_human passing only the customer's original message."}, {"k": "D", "t": "Persist the complete conversation and tool response history to a database, then call escalate_to_human with a reference ID."}]}, {"id": "52", "topic": "tools-and-mcp", "ans": "D", "g": 8, "qn": "32", "qt": "During a billing dispute resolution, your agent successfully retrieves customer info via get_customer and order details via lookup_order, but when attempting to process the refund via process_refund, the tool returns a timeout error. The agent has enough information to explain the billing, confirm the refund eligibility, and verify refund eligibility, but cannot actually process the refund due to the backend failure. What approach best balances first-contact resolution with appropriate error handling?", "mn": "", "opts": [{"k": "A", "t": "Escalate immediately to a human agent since the refund action cannot be completed"}, {"k": "B", "t": "Implement automatic retries with exponential backoff for process_refund, keeping the conversation open until the refund is successfully processed"}, {"k": "C", "t": "Confirm the refund will be processed and close the conversation, since the system has all necessary information to complete it automatically"}, {"k": "D", "t": "Explain the billing, confirm refund eligibility, acknowledge the system issue preventing immediate processing, and offer escalation or retry later"}]}, {"id": "54", "topic": "tools-and-mcp", "ans": "C", "g": 8, "qn": "33", "qt": "When the agent calls lookup_order and receives order details showing the item was purchased 45 days ago, how does the agentic loop determine whether to call process_refund or escalate_to_human next?", "mn": "", "opts": [{"k": "A", "t": "The agent executes the remaining steps in a tool sequence planned at the start of the request."}, {"k": "B", "t": "The agent follows a pre-configured decision tree mapping order attributes to specific tool calls."}, {"k": "C", "t": "The order details are added to the conversation and the model reasons about which action to take."}, {"k": "D", "t": "The orchestration layer automatically routes to the next tool based on the order's status field."}]}, {"id": "55", "topic": "tools-and-mcp", "ans": "D", "g": 8, "qn": "34", "qt": "A customer writes: \"I've been going back and forth on this return for days. I just want to speak to someone who can actually help me.\" The agent has confirmed via lookup_order that the return is straightforward–within policy and eligible for immediate processing. What should the agent do?", "mn": "", "opts": [{"k": "A", "t": "Process the refund via process_refund to resolve the underlying issue, then inform them it's complete"}, {"k": "B", "t": "Ask what specifically hasn't worked in previous attempts before deciding whether to escalate or resolve automatically"}, {"k": "C", "t": "Acknowledge frustration, inform them this is resolvable now, and offer to complete it or escalate"}, {"k": "D", "t": "Call escalate_to_human immediately to honor the customer's request"}]}, {"id": "56", "topic": "tools-and-mcp", "ans": "A", "g": 8, "qn": "35", "qt": "Compliance requires that refunds exceeding $500 must automatically escalate to a human agent–this rule cannot be left to model discretion. Despite clear system prompt instructions, production logs show the agent occasionally processes high-value refunds directly (3% failure rate). How should you achieve guaranteed compliance?", "mn": "", "opts": [{"k": "A", "t": "Implement a hook to intercept tool calls; when the refund process amount exceeds $500, block it and invoke human escalation."}, {"k": "B", "t": "Strengthen the system prompt with emphatic language: \"CRITICAL POLICY: Refunds over $500 MUST trigger human escalation. NEVER process these directly.\""}, {"k": "C", "t": "Modify the refund tool to return an error with message \"Amount exceeds policy limit–please escalate\" when threshold is exceeded."}, {"k": "D", "t": "Add few-shot examples to the prompt showing correct escalation behavior at various refund amounts ($400, $500, $600)."}]}, {"id": "57", "topic": "context-and-prompting", "ans": "A", "g": 8, "qn": "36", "qt": "A customer raises three separate issues during one session: a refund inquiry (turns 1-15), a subscription question (turns 16-30), and a payment method update (turns 31-45). At turn 48, the customer asks \"What happened with my refund?\" The conversation is approaching context limits. What strategy best maintains the agent's ability to address all issues throughout the session?", "mn": "", "opts": [{"k": "A", "t": "Extract and persist structured issue data (order IDs, amounts, statuses) into a separate context layer."}, {"k": "B", "t": "Rely on MCP tools to re-fetch relevant information on demand when the customer references earlier issues."}, {"k": "C", "t": "Implement sliding window context that retains the most recent 30 turns."}, {"k": "D", "t": "Summarize earlier turns into a narrative description, preserving full message history only for the active issue."}]}, {"id": "60", "topic": "context-and-prompting", "ans": "A", "g": 8, "qn": "37", "qt": "A customer returns 4 hours after their initial session about the same billing dispute. The previous 32-turn session contains context: lookup_status_result messages containing \"Status: Pending Refund\" and significant tokens from prior lookup results. The agent needs to be prepared to answer the customer fully. What approach most reliably handles returning customers?", "mn": "", "opts": [{"k": "A", "t": "Start a new session, inject a structured summary of the previous interaction (issue type, resolution steps, current status), then make fresh tool calls as needed."}, {"k": "B", "t": "Resume with the full conversation and add a system prompt instruction that instructs the agent to prioritize resolving the pending refund."}, {"k": "C", "t": "Resume with state and configure the agent to automatically re-call all previous tool_results messages to ensure data freshness."}, {"k": "D", "t": "Resume the previous session with the full history and ask the customer to restate the dispute before deciding whether fresh lookups are necessary."}]}, {"id": "61", "topic": "structured-extraction", "ans": "D", "g": 8, "qn": "38", "qt": "Your extraction pipeline processes invoices and extracts line items, subtotals, tax amounts, and grand totals. During evaluation, you discover that in 18% of extractions, the sum of extracted line item amounts doesn't match the extracted grand total—sometimes due to OCR errors in the source document, sometimes due to extraction mistakes by the model. Downstream accounting systems reject records with mismatched totals. What's the most effective approach to improve extraction reliability?", "mn": "", "opts": [{"k": "A", "t": "Add few-shot examples demonstrating invoices where extracted line items sum correctly to the stated total, encouraging the model to produce mathematically consistent extractions."}, {"k": "B", "t": "Implement post-processing that automatically adjusts line item amounts proportionally when their sum doesn't match the stated total."}, {"k": "C", "t": "Extract line items and totals independently, then use a separate validation model to reconcile discrepancies by determining which extracted values are most likely correct."}, {"k": "D", "t": "Add a \"calculated_total\" field where the model sums extracted line items alongside a \"stated_total\" field. Flag records for human review when values differ."}]}, {"id": "62", "topic": "developer-productivity", "ans": "B", "g": 8, "qn": "39", "qt": "An engineer asks your agent to identify untested code paths in a legacy payment processing module spanning 45 files. After reading the first 8 source files, the agent's responses are becoming noticeably less accurate — it's forgetting previously discussed code patterns and hasn't yet located all test files or traced critical payment flows. What's the most effective approach to complete this investigation?", "mn": "", "opts": [{"k": "A", "t": "Clear context with /clear, then selectively re-read only the most critical files discovered so far, writing key findings to a scratchpad file that persists between context resets."}, {"k": "B", "t": "Spawn subagents to investigate specific questions (e.g., \"find all test files for payment processing\", \"trace refund flow dependencies\") while the main agent coordinates findings and preserves high-level understanding."}, {"k": "C", "t": "Document all current findings in a summary report, clear context completely, then use that report as the sole reference for continuing the investigation."}, {"k": "D", "t": "Switch to using Grep to search for specific function names instead of reading full files, reducing the content loaded into context for remaining exploration."}]}, {"id": "63", "topic": "multi-agent-systems", "ans": "D", "g": 8, "qn": "40", "qt": "The coordinator agent has AgentDefinitions configured for all four specialized subagents, each with appropriate descriptions, prompts, and tool restrictions. During testing, you notice the coordinator correctly reasons about when to delegate — it generates messages like \"I'll ask the web search agent to find sources on this topic\" — but no subagent execution ever occurs. The coordinator then proceeds as if the delegation happened and continues with incomplete information. Logs show no errors. What is the most likely cause?", "mn": "", "opts": [{"k": "A", "t": "Subagent context isolation means task descriptions from the coordinator don't automatically reach subagents; you need to configure explicit context forwarding in ClaudeAgentOptions."}, {"k": "B", "t": "The AgentDefinitions are configured correctly, but the coordinator's system prompt doesn't explicitly list the available subagent types, preventing the model from knowing they can be invoked."}, {"k": "C", "t": "The coordinator's max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent type parameter can be specified."}, {"k": "D", "t": "The coordinator's allowedTools configuration doesn't include \"Task\", so while it can reason about delegation, it cannot invoke the tool required to spawn subagents."}]}, {"id": "67", "topic": "tools-and-mcp", "ans": "C", "g": 8, "qn": "41", "qt": "This currently requires manually copy-pasting content into conversations. The team wants the agent to access this standard Jira ticket data directly. What's the most effective approach?", "mn": "", "opts": [{"k": "A", "t": "Use the Bash tool with curl to call Jira's REST API, including authentication headers and parsing JSON responses inline."}, {"k": "B", "t": "Build a custom MCP server wrapping Jira's API with tools designed specifically for this team's code review workflow."}, {"k": "C", "t": "Integrate an existing Jira MCP server that exposes tickets, comments, and metadata through discoverable tool interfaces."}, {"k": "D", "t": "Export Jira tickets to markdown files in the repository that the agent accesses using the Read tool."}]}, {"id": "68", "topic": "developer-productivity", "ans": "A", "g": 8, "qn": "42", "qt": "A critical bug is affecting production users. Error logs show exceptions in the OrderProcessing module with a clear stack trace pointing to a specific area, but you haven't worked with this module before. What's the most effective approach?", "mn": "", "opts": [{"k": "A", "t": "Use direct execution to examine the stack trace, read the relevant code, and implement a fix once you identify the root cause."}, {"k": "B", "t": "Use plan mode to analyze the error in context of the module's design, enumerate potential root causes, and prioritize fixes systematically."}, {"k": "C", "t": "Start with direct execution to gather initial information, then switch to plan mode to design a comprehensive solution before implementing."}, {"k": "D", "t": "Enter plan mode to explore the module's architecture and dependencies before attempting any fix."}]}, {"id": "70", "topic": "tools-and-mcp", "ans": "C", "g": 8, "qn": "43", "qt": "Your remove_team_member tool uses a dry_run: boolean parameter for previewing impacts before execution. Production monitoring shows the agent bypasses the preview step in 15% of calls by calling with dry_run=false directly. You need to ensure every removal is preceded by a preview that the user explicitly confirms. What is the most reliable approach?", "mn": "", "opts": [{"k": "A", "t": "Add detailed instructions and few-shot examples to the tool description requiring the agent to always call with dry_run=true first and wait for user confirmation before calling with dry_run=false."}, {"k": "B", "t": "Annotate the tool as requiring confirmation and configure the orchestration layer to prompt the user for approval before forwarding any calls to annotated tools."}, {"k": "C", "t": "Replace with two tools: preview_remove_member returns impact details and a single-use confirmation token; execute_remove_member requires that token, binding execution to the specific previewed action."}, {"k": "D", "t": "Add server-side validation that permits dry_run=false only when a dry_run=true call with identical parameters occurred within the past 60 seconds."}]}, {"id": "71", "topic": "structured-extraction", "ans": "D", "g": 8, "qn": "44", "qt": "Your invoice extraction uses tool use with strict JSON schemas. JSON syntax errors never occur, but 12% of extractions fail semantic validation--for example, line Item amounts don't extracted total, or vendor IDs don't match valid formats. These failures currently route to manual review. What's the most effective approach to reduce manual review volume while maintaining accuracy?", "mn": "", "opts": [{"k": "A", "t": "Add stricter schema constraints with detailed field descriptions to prevent the model from generating invalid values initially."}, {"k": "B", "t": "Retry the extraction up to 3 times when validation fallis, accepting the first result that passes validation."}, {"k": "C", "t": "Implement post-processing logic that automatically corrects common amors, such as recalculating totais from line items when sums don't match."}, {"k": "D", "t": "When validation falls, make a follow-up request with the document, extraction, and validation errors for model correction."}]}, {"id": "73", "topic": "structured-extraction", "ans": "D", "g": 8, "qn": "45", "qt": "Your extraction system uses tool_use with a JSON schema containing 12 fields and detailed descriptions, totaling approximately 2,500 tokens for the complete tool definition. Processing documents under 150K tokens yields 98% accuracy. For documents between 175-190K tokens, accuracy drops to 71%, with information from the final third consistently missed. The model's context window is 200K tokens. What is the most likely cause?", "mn": "", "opts": [{"k": "A", "t": "Schemas exceeding 8-10 fields increase decision complexity during parameter generation, reducing extraction accuracy independent of document length."}, {"k": "B", "t": "The model distributes attention proportionally across input length, causing fields mentioned only once near the document's end to receive insufficient processing focus."}, {"k": "C", "t": "Very long documents exceed the model's effective attention span regardless of context limits, causing accuracy degradation for content farther from the prompt instructions."}, {"k": "D", "t": "Tool definitions consume input context tokens. Combined with system prompts and document content, the total approaches the context limit, degrading end-of-document processing."}]}, {"id": "74", "topic": "structured-extraction", "ans": "B", "g": 8, "qn": "46", "qt": "The extraction pipeline receives documents of varying types—some are invoices, others are contracts, and some are receipts. You've defined separate extraction tools, each with its own schema tailored to the document type. During testing, you observe that with tool_choice: \"auto\", Claude sometimes returns conversational text instead of calling an extraction tool, causing downstream parsing failures. You need guaranteed structured output without knowing the document type in advance. What's the most effective approach?", "mn": "", "opts": [{"k": "A", "t": "Add a preliminary classification call, then make a second call with tool_choice forced to the identified extraction tool."}, {"k": "B", "t": "Set tool_choice: \"any\" with all extraction tools defined."}, {"k": "C", "t": "Consolidate all document types into a single unified-schema extraction tool and force that tool."}, {"k": "D", "t": "Keep tool_choice: \"auto\" with system prompt instructions requiring tool use."}]}, {"id": "75", "topic": "structured-extraction", "ans": "B", "g": 8, "qn": "47", "qt": "Monitoring shows 12% of extractions fall Pydantic validation with specific errors like \"expected float for quantity, got '2 to 3\". Retrying these requests without modification produces failures. What's the most effective approach to recover from these validation failures?", "mn": "", "opts": [{"k": "A", "t": "Set temperature to 0 to eliminate output variability and ensure consistent formatting"}, {"k": "B", "t": "Send a follow-up request including the validation error, asking the model to correct its output"}, {"k": "C", "t": "Implement a secondary pipeline using a larger model tier to reprocess documents that fail validation"}, {"k": "D", "t": "Pre-process source documents to standardize problematic formats before sending them for extraction"}]}, {"id": "76", "topic": "context-and-prompting", "ans": "D", "g": 8, "qn": "48", "qt": "After three months of weekly sessions, your conversation history has grown to 85,000 tokens. When users ask \"What did we conclude about the theme of isolation?\", the assistant provides generic literary analysis rather than referencing the group's specific insights from earlier sessions. Discussions often build on previous meetings' conclusions, so maintaining narrative context is important. What's the most effective approach?", "mn": "", "opts": [{"k": "A", "t": "Add structured XML tags to mark significant discussion conclusions throughout the conversation history."}, {"k": "B", "t": "Implement rolling window truncation to keep only the most recent 25,000 tokens."}, {"k": "C", "t": "Use semantic embedding to index the full conversation history and retrieve only relevant past exchanges for each user query, replacing the linear conversation format with retrieved segments."}, {"k": "D", "t": "Implement progressive summarization where older conversation blocks are replaced with concise summaries that explicitly extract key conclusions, decisions, and recurring themes, keeping recent exchanges verbatim."}]}, {"id": "77", "topic": "context-and-prompting", "ans": "A", "g": 8, "qn": "49", "qt": "You're Implementing a feature where users refine their playlist preferences through multiple conversation turns. After deploying, you notice Claude's responses don't reflect what us earlier in the same conversation— for example, a user says they love jazz, but two messages later Claude asks what genres they enjoy. What is the most likely cause?", "mn": "", "opts": [{"k": "A", "t": "Your application isn't including prior messages in the messages array"}, {"k": "B", "t": "The model's context window has been exceeded by the conversation length"}, {"k": "C", "t": "Claude requires a vector database connection to maintain conversation memory"}, {"k": "D", "t": "The Claude API requires a session_id parameter that you haven't configured"}]}, {"id": "78", "topic": "context-and-prompting", "ans": "C", "g": 8, "qn": "50", "qt": "Your home renovation planning assistant uses a system prompt defining an expert contractor persona with specific guidelines: always ask about budget, suggest alternatives at multiple price points, and confirm timeline requirements. During testing, responses follow these guidelines for turns 1-4, but by turn 7, the assistant gives generic advice without asking about budget or timeline. The conversation is only 2,000 tokens—well within the context window. What is the most likely cause?", "mn": "", "opts": [{"k": "A", "t": "The model's attention on system prompt instructions naturally weakens as turns accumulate."}, {"k": "B", "t": "System prompts only establish initial behavior and don't persist across all turns."}, {"k": "C", "t": "The system prompt is only sent with the first API request."}, {"k": "D", "t": "The assistant's accumulated responses are diluting the system prompt's influence."}]}, {"id": "79", "topic": "context-and-prompting", "ans": "D", "g": 8, "qn": "51", "qt": "Users report that during extended conversations, the AI loses track of specific topics, examples, and preferences they mentioned earlier in the session. Your current implementation uses a sliding window that keeps only the most recent 25 message pairs to stay within context limits. What's the most effective approach to maintain awareness of earlier conversation content while managing context size?", "mn": "", "opts": [{"k": "A", "t": "Increase the window size to 50 message pairs to retain more conversation history before truncation."}, {"k": "B", "t": "Add a separate API call each turn to summarize messages being dropped, prepending this running summary to the conversation."}, {"k": "C", "t": "Implement vector similarity search over the full conversation history, retrieving relevant past messages for each user query."}, {"k": "D", "t": "Replace the sliding window with a hybrid approach: summarize older messages while keeping recent messages verbatim."}]}, {"id": "80", "topic": "context-and-prompting", "ans": "B", "g": 8, "qn": "52", "qt": "During QA testing, you notice that Claude follows your system prompt guidelines consistently in the first 10- 15 turns, but by turn 25-30, responses begin deviating—using informal tone when formality was specified, occasionally skipping required formatting, or providing information types the guidelines restrict. Conversation length is well within context limits (typically 30,000 tokens out of 200,000 available). What's the most effective approach to maintain consistent behavior throughout extended conversations?", "mn": "", "opts": [{"k": "A", "t": "Automatically start a new conversation after 20 turns, passing a summary of the prior context to maintain continuity."}, {"k": "B", "t": "Insert user-role messages that reinforce critical guidelines at natural conversation breakpoints, especially before complex requests."}, {"k": "C", "t": "Move behavioral guidelines from the system prompt into the first user message."}, {"k": "D", "t": "Implement post-response validation that regenerates each response until it conforms to the specified guidelines."}]}, {"id": "81", "topic": "context-and-prompting", "ans": "D", "g": 8, "qn": "53", "qt": "During a conversation about order tracking, your external system receives a webhook indicating the user's package has shipped. The user is actively chatting and will likely send a follow-up message soon. You want the assistant to naturally incorporate this status change in its next response. What's the most effective approach?", "mn": "", "opts": [{"k": "A", "t": "Immediately send an API request with the update as a synthetic user message, generating an unsolicited assistant response."}, {"k": "B", "t": "Append the status update as a prefix to the next user message before calling the API."}, {"k": "C", "t": "Configure the assistant to call a get_order_status tool at the start of every response."}, {"k": "D", "t": "Add the current shipping status to the system prompt before the next API call."}]}, {"id": "82", "topic": "context-and-prompting", "ans": "A", "g": 8, "qn": "54", "qt": "Users report that responses feel repetitive across turns—each message begins with phrases like \"Certainly!\" or \"I'd be happy to help!\" even deep into conversations. You want responses to feel more natural, without these repetitive openers. What's the most effective approach?", "mn": "", "opts": [{"k": "A", "t": "Add system prompt instructions specifying phrases to avoid, such as \"Never begin responses with 'Certainly' or similar affirmations\""}, {"k": "B", "t": "Implement post-processing to detect and strip common greeting phrases from response beginnings"}, {"k": "C", "t": "Append a partial assistant message with a direct response opening that the model will continue from"}, {"k": "D", "t": "Lower the temperature parameter to make response openings more deterministic and less variable"}]}, {"id": "83", "topic": "context-and-prompting", "ans": "A", "g": 8, "qn": "55", "qt": "Users frequently send ambiguous requests like \"book a venue for the party\" without specifying date, guest count, or budget. Your evaluation shows the assistant asks an average of 4.2 clarifying questions before taking any action, causing 35% of users to abandon mid-conversation. However, when you reduce questions, users sometimes receive recommendations that don't match their preferences. What's the most effective approach to improve this trade-off?", "mn": "", "opts": [{"k": "A", "t": "Instruct the assistant to state explicit assumptions based on conversation history, proceed with recommendations while inviting corrections, and reserve clarifying questions only for irreversible actions like confirming bookings."}, {"k": "B", "t": "Configure the assistant to consolidate all clarifying questions into a single compound question (e.g., \"What date, guest count, and budget are you considering?\") to reduce the total number of conversational turns."}, {"k": "C", "t": "Implement a structured intake form that collects all required parameters (date, guest count, budget, venue type) upfront before the assistant begins providing any recommendations."}, {"k": "D", "t": "Configure the assistant to proceed with reasonable defaults (medium-sized venue, next weekend, moderate budget) without explicitly stating these assumptions, allowing users to provide corrections if results don't match expectations."}]}, {"id": "85", "topic": "structured-extraction", "ans": "D", "g": 8, "qn": "56", "qt": "The system routes documents with extraction confidence below 85% to human review. A quarterly audit reveals that 12% of high-confidence extractions (>85%) also contain errors—cases where the model finds plausible-but-incorrect values. Error sources vary: comparison tables showing competitor specs, appendices referencing different product variants, and ambiguous phrasing the model misinterprets. You need a sustainable strategy to catch these high-confidence errors and measure whether improvements reduce the error rate over time. What approach is most effective?", "mn": "", "opts": [{"k": "A", "t": "Add a verification pass that re-extracts from each high-confidence document, flagging cases where the two extraction attempts produce different results."}, {"k": "B", "t": "Lower the confidence threshold from 85% to 70%, routing a larger volume of extractions to human review."}, {"k": "C", "t": "Implement heuristic rules that flag documents containing comparison tables or appendices for review regardless of confidence score."}, {"k": "D", "t": "Implement stratified random sampling reviewing a fixed percentage of high-confidence extractions weekly, enabling error rate measurement and novel pattern detection."}]}, {"id": "86", "topic": "context-and-prompting", "ans": "C", "g": 8, "qn": "57", "qt": "Your research assistant helps users analyze academic papers over extended conversations. User testing reveals a recurring issue: after conversations exceed 60K tokens, users ask follow-up questions requiring precise numerical details from papers discussed earlier—sample sizes, exact p-values, specific inclusion criteria. Your current approach summarizes paper discussions after 8 turns to stay within context limits. Users report that responses to these precision-dependent questions are often hedged or inaccurate. What's the most effective architectural change?", "mn": "", "opts": [{"k": "A", "t": "Keep source text from methodology and results sections in context permanently, while summarizing only the conversational discussion and interpretation portions."}, {"k": "B", "t": "Use a separate Claude call with explicit instructions to generate higher-fidelity summaries that preserve all numerical details and statistical values."}, {"k": "C", "t": "Implement retrieval that re-injects relevant paper sections when the user's question suggests they need specific numerical details."}, {"k": "D", "t": "Maintain a structured database of key facts extracted from each paper (sample sizes, statistics, methods) and retrieve relevant entries into context when precision-dependent questions are detected."}]}, {"id": "87", "topic": "developer-productivity", "ans": "C", "g": 8, "qn": "58", "qt": "A security audit requires updating your authentication library from v2 to v3. The migration guide documents breaking changes: authenticate() now returns a Promise instead of accepting a callback, the User type has restructured fields, and three deprecated methods were removed. Grep shows the library is imported in 45 files across several modules. What's the most effective approach?", "mn": "", "opts": [{"k": "A", "t": "Create a custom slash command encapsulating the migration transformations, then execute it against each file without prior codebase exploration."}, {"k": "B", "t": "Update the dependency version, run the test suite, and use Claude Code to fix each failure as it appears."}, {"k": "C", "t": "Enter plan mode to explore library usage across modules, map affected code paths, then create a migration strategy before implementing."}, {"k": "D", "t": "Paste the migration guide's breaking changes into your prompt and use direct execution to update all usages across the 45 files."}]}, {"id": "88", "topic": "developer-productivity", "ans": "A", "g": 8, "qn": "59", "qt": "You've asked Claude Code to build a PDF report generation feature. The initial implementation queries the database correctly, but the output has formatting issues: table columns are too narrow causing content truncation, dates display without proper formatting, and page break handling is incorrect. You've noticed these issues interact— changing column widths affects how dates render, and page breaks depend on content height. What's the most effective approach for iterating toward a working solution?", "mn": "", "opts": [{"k": "A", "t": "Address the column width issue first with specific measurements, verify it works, then fix date formatting within the corrected columns, then adjust page breaks— testing after each change."}, {"k": "B", "t": "Show Claude an example of a correctly formatted report and ask it to match that output, rather than listing the specific technical issues."}, {"k": "C", "t": "Start fresh with a detailed prompt specifying all formatting requirements upfront."}, {"k": "D", "t": "Provide all three issues in a single detailed message with exact specifications for each, allowing Claude to address them together in one update."}]}, {"id": "92", "topic": "tools-and-mcp", "ans": "A", "g": 8, "qn": "60", "qt": "Anthropic's tool use documentation states: \"Write instructive error messages. Instead of generic errors like 'failed', include what went wrong and what Claude should try next.\" A billing dispute agent uses lookup_order, which catches all exceptions and returns a tool_result with is_error: true and the message \"execution failed\". Monitoring shows two failure modes: the agent retries the identical call until hitting the turn limit, or it immediately calls escalate_to_human without trying alternative tools. Which change follows the documented recommendation and gives Claude the information it needs to select the correct recovery action for each error type?", "mn": "", "opts": [{"k": "A", "t": "Return error-type-specific messages with is_error: true, e.g., \"order not found-try get_customer to search by phone\" for data errors and \"Database timeout (transient)-retry should succeed\" for infrastructure errors."}, {"k": "B", "t": "Implement retry logic with exponential backoff inside each tool implementation so transient errors are resolved transparently within the tool before any failure result is surfaced to Claude in the agentic loop."}, {"k": "C", "t": "Remove is_error: true and return the error details as normal tool content, so Claude reasons about the response as data rather than treating it as a flagged failure condition that biases retry behavior."}, {"k": "D", "t": "Add an error classification step in the agentic loop that intercepts tool errors before Claude sees them, tags each as \"retry\" \"try_alternative,\" or \"escalate,\" and adds that recommendation to the tool result."}]}, {"id": "94", "topic": "developer-productivity", "ans": "B", "g": 8, "qn": "61", "qt": "Your code review prompts include both implementation changes and the corresponding test file, but the LLM's review comments fail to point out untested code paths. Analysis reveals the model correctly flags functions that have no tests at all, but fails to identify when conditional branches or error-handling paths within tested functions that have no tests at all, but fails to identify when conditional branches or error-handling paths within tested functio lack coverage. What's the most effective way to improve detection of branch-level coverage gaps without overcomplicating the pipeline?", "mn": "", "opts": [{"k": "A", "t": "Implement a multi-pass pipeline where separate LLM calls first extract all conditional branches, then cross-reference each against test assertions in a second pass."}, {"k": "B", "t": "Add explicit instructions directing the model to enumerate each conditional branch and exception path, then verify each has a corresponding test assertion."}, {"k": "C", "t": "Restructure the prompt to interleave implementation and tests, presenting each function followed immediately by its test cases"}, {"k": "D", "t": "Include few-shot examples showing code with an uncovered branch paired with the review comment identifying the specific missing test case."}]}, {"id": "96", "topic": "developer-productivity", "ans": "A", "g": 8, "qn": "62", "qt": "Your pipeline reviews every PR using a single API call with a static prompt containing the diff and full text of each changed file — unchanged files are not included. Reviews are posted asynchronously and don't block PR creation. Developers report that reviews consistently miss bugs involving cross-file interactions — for example, a PR renames a function's parameters but the review doesn't flag callers in unchanged files that still use the old argument order. Evaluation shows cross-file bugs account for 35% of production incidents from reviewed PRs. What is the most effective change to your review design?", "mn": "", "opts": [{"k": "A", "t": "Redesign the review as a turn-limited agentic task where the model can read files and search the codebase via tools, following references to verify cross-file findings."}, {"k": "B", "t": "Run parallel review passes per changed file with direct dependents included in each pass, then aggregate and deduplicate findings using a final summarization call."}, {"k": "C", "t": "Use static analysis to build a dependency graph of changed code, then expand the prompt to include all files within two dependency hops of any changed file."}, {"k": "D", "t": "Add chain-of-thought instructions asking the model to list all external references in the diff, then reason step-by-step about how each change might affect callers in other files."}]}, {"id": "97", "topic": "tools-and-mcp", "ans": "D", "g": 8, "qn": "63", "qt": "Your search Flights tool calls an external airline API that occasionally returns a 503 Service Unavailable error. What is the most effective way to handle this error in your tool implementation?", "mn": "", "opts": [{"k": "A", "t": "Return an empty flight list as if the search succeeded but found no matching flights."}, {"k": "B", "t": "Log the error internally and return an empty response, letting the model continue without the flight data."}, {"k": "C", "t": "Return an error message in the tool result explaining the service is temporarily unavailable."}, {"k": "D", "t": "Automatically retry the request up to five times with exponential backoff before returning results to the agent."}]}, {"id": "99", "topic": "context-and-prompting", "ans": "A", "g": 8, "qn": "64", "qt": "During initial testing, you notice that Claude doesn't seem to remember vocabulary words from earlier in the conversation. When a student asks \"Can you quiz me on those words?\", responds as if no words have been discussed. What is the most likely explanation?", "mn": "", "opts": [{"k": "A", "t": "You're not including prior messages in each API request—the stateless API doesn't retain conversation history."}, {"k": "B", "t": "The model's context window has filled up, causing earlier conversation content to be dropped."}, {"k": "C", "t": "Your system prompt needs explicit instructions telling Claude to remember information from earlier turns."}, {"k": "D", "t": "You need to enable conversation persistence by passing a session ID parameter with each API call."}]}, {"id": "100", "topic": "context-and-prompting", "ans": "A", "g": 8, "qn": "65", "qt": "A new user's first message is \"Set up my focus music,\" This could mean configure preferences, create a playlist, or play music immediately. Your system supports all three actions. What's the effective approach?", "mn": "", "opts": [{
